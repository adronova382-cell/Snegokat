<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1624">
<title>Снегокат: гаражный тюнинг</title>
<style>
:root {
  --bg: #0f1624;
  --panel: #18233a;
  --panel2: #1f2c48;
  --line: #2c3d63;
  --text: #e8f0ff;
  --muted: #8ea2c8;
  --accent: #4fc3f7;
  --hot: #ff7043;
  --good: #69f0ae;
  --bad: #ff5252;
  --gold: #ffd740;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; }
.hidden { display: none !important; }
.small { font-size: 13px; }
.muted { color: var(--muted); }

.screen { position: fixed; inset: 0; display: none; }
.screen.active { display: block; }

/* ---------- кнопки */
.btn {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 14px; cursor: pointer; transition: transform .08s, background .15s; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: #29396012; background: #283a60; }
.btn:active:not(:disabled) { transform: scale(.96); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, #ff8a50, #f4511e); border-color: #ff8a50; color: #fff; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #ff9e6b, #ff5722); }
.btn.danger { background: #5c1a1a; border-color: #8e2424; }
.btn.active { background: var(--accent); color: #062033; border-color: var(--accent); font-weight: 600; }
.btn.big { font-size: 20px; padding: 14px 34px; border-radius: 14px; }
.btn.small { padding: 4px 10px; font-size: 13px; }

/* ---------- титул */
#scr-title { background: radial-gradient(ellipse at 50% 120%, #2a4a7a 0%, #0f1624 60%); }
.title-box { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; gap: 10px; }
.title-icon { font-size: 80px; animation: bob 2s ease-in-out infinite; }
h1 { font-size: clamp(42px, 10vw, 88px); margin: 0; letter-spacing: 6px; background: linear-gradient(180deg, #fff, #9fd3ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 40px rgba(79,195,247,.3); }
.sub { color: var(--muted); margin: 0 0 20px; }
.title-snow { position: absolute; inset: 0; background-image: radial-gradient(2px 2px at 20% 30%, #fff, transparent), radial-gradient(2px 2px at 70% 20%, #fff, transparent), radial-gradient(1.5px 1.5px at 40% 70%, #fff, transparent), radial-gradient(2px 2px at 85% 60%, #fff, transparent), radial-gradient(1.5px 1.5px at 10% 85%, #fff, transparent), radial-gradient(1.5px 1.5px at 55% 45%, #fff, transparent); background-size: 300px 300px; animation: snow 12s linear infinite; opacity: .7; }
@keyframes snow { to { background-position: 60px 300px; } }
@keyframes bob { 50% { transform: translateY(-10px) rotate(-4deg); } }

/* ---------- гараж */
#scr-garage { display: none; flex-direction: column; background: linear-gradient(180deg, #121b2d, #0c1220); }
#scr-garage.active { display: flex; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.logo { font-weight: 800; font-size: 20px; }
.coins { margin-left: auto; font-weight: 700; font-size: 20px; color: var(--gold); background: #0006; padding: 4px 14px; border-radius: 20px; }
.tabs { display: flex; gap: 4px; padding: 8px 12px 0; overflow-x: auto; background: var(--panel); scrollbar-width: none; }
.tabs button { background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--muted); white-space: nowrap; font-size: 15px; }
.tabs button.active { color: var(--text); border-color: var(--hot); }
.g-body { flex: 1; overflow-y: auto; padding: 14px 16px 40px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
.card h3 { margin: 4px 0 8px; font-size: 16px; }
.card.hero { text-align: center; padding: 30px; background: linear-gradient(135deg, #3e1d0e, #18233a); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
.preview-card canvas { width: 100%; height: auto; border-radius: 10px; display: block; margin-bottom: 8px; }
.row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
.wrap { flex-wrap: wrap; }
.chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.chip.on { background: #1e4b3a; border-color: var(--good); }
.tag { background: var(--panel2); border-radius: 8px; padding: 3px 8px; font-size: 13px; }
.tag.hot { background: #5a2410; color: #ffab91; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #0006; cursor: pointer; }
.sw.sel { border-color: #fff; transform: scale(1.1); }
.bar { height: 10px; background: #0007; border-radius: 6px; overflow: hidden; margin: 6px 0; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--good)); transition: width .2s; }
.mix { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin: 8px 0; }
.mix label { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); gap: 4px; }
.mix input { width: 110px; background: #0b1220; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 6px 8px; font-size: 16px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.proj { display: flex; flex-direction: column; gap: 6px; margin: 0; }
.proj.done { border-color: #2e7d5b; background: linear-gradient(180deg, #17322a, var(--panel)); }
.proj .eff { color: #b3e5fc; }
.diff { font-size: 11px; opacity: .7; }
.parts { display: flex; flex-wrap: wrap; gap: 4px; }
.part { font-size: 12px; padding: 3px 7px; border-radius: 6px; background: #0005; }
.part.ok { color: var(--good); }
.part.no { color: #ff8a80; }
.badge { display: inline-block; background: #1e4b3a; color: var(--good); padding: 4px 10px; border-radius: 8px; font-size: 13px; font-weight: 600; }

.stages { display: flex; flex-direction: column; gap: 8px; }
.stage { display: flex; gap: 12px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stage .num { width: 32px; height: 32px; flex: none; border-radius: 50%; background: var(--panel2); display: grid; place-items: center; font-weight: 700; }
.stage.done { opacity: .65; }
.stage.done .num { background: #2e7d5b; }
.stage.cur { border-color: var(--hot); box-shadow: 0 0 0 1px var(--hot) inset; }
.stage.cur .num { background: var(--hot); }
.stage.locked { opacity: .45; }
.sbody { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }

.cats { margin-bottom: 10px; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.item .ico { font-size: 30px; width: 40px; text-align: center; }
.item .info { flex: 1; min-width: 0; }
.item .have { color: var(--accent); }
.btn.buy { font-weight: 700; color: var(--gold); }

.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; text-align: center; }
.stats b { display: block; font-size: 22px; }
.stats small { color: var(--muted); }
.pad { padding: 4px 4px 0; }
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.ach { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; opacity: .55; display: flex; flex-direction: column; gap: 3px; }
.ach.got { opacity: 1; border-color: #8d6e00; background: linear-gradient(180deg, #3a3010, var(--panel)); }
.ach small { color: var(--muted); }
textarea.code { width: 100%; height: 110px; background: #0b1220; color: var(--text); border: 1px solid var(--line); border-radius: 8px; font-family: monospace; font-size: 11px; padding: 8px; }

/* ---------- горка */
#ride-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.ride-top { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.ride-top .btn { background: #000a; border-color: #ffffff22; padding: 6px 12px; }
.build-bar { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: #0b1220dd; padding: 8px; border-radius: 12px; border: 1px solid var(--line); }
.build-bar button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 14px; }
.build-bar button.active { background: var(--accent); color: #062033; font-weight: 700; }
.build-bar button.danger { background: #5c1a1a; }
.build-bar .snow { margin: 0 6px; font-size: 14px; }
#b-left { margin-left: auto; }
#b-left, #b-right { padding: 7px 16px; font-size: 18px; }

.touch { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; padding: 10px; pointer-events: none; gap: 6px; }
.touch > div { display: flex; gap: 8px; pointer-events: auto; }
.touch .tc { flex-wrap: wrap; justify-content: center; max-width: 260px; gap: 6px; }
.touch .tr { flex-direction: column; align-items: flex-end; }
.touch button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #ffffff55; background: #0007; color: #fff; font-size: 24px; touch-action: none; user-select: none; -webkit-user-select: none; }
.touch .tc button { width: 46px; height: 46px; font-size: 20px; }
.touch button.sm { width: 74px; height: 40px; border-radius: 20px; font-size: 14px; }
.touch button.wide { width: 110px; height: 64px; border-radius: 32px; font-size: 18px; font-weight: 700; background: #f4511e99; }
.touch button.on { background: #4fc3f799; transform: scale(.94); }

/* ---------- оверлеи */
.overlay { position: fixed; inset: 0; background: #000b; display: flex; align-items: center; justify-content: center; z-index: 50; padding: 10px; }
#modal { z-index: 60; }
.modal-win { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px #000a; animation: pop .18s ease-out; }
.modal-win h2 { margin: 0 0 10px; }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 14px; }
@keyframes pop { from { transform: scale(.92); opacity: 0; } }
.summary { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.big-num { font-size: 44px; font-weight: 800; }
.big-num small { font-size: 15px; font-weight: 400; color: var(--muted); }
.coins-earned { font-size: 30px; font-weight: 800; color: var(--gold); margin-top: 6px; }
table.keys { border-collapse: collapse; width: 100%; font-size: 14px; }
table.keys td { padding: 4px 6px; border-bottom: 1px solid var(--line); }
kbd { background: #0b1220; border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 5px; padding: 1px 6px; font-size: 12px; }

.mg-win { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: min(1200px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.mg-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.mg-head h2 { margin: 0; font-size: 18px; }
.mg-main { display: flex; gap: 10px; padding: 10px; min-height: 0; flex: 1; }
#mg-canvas { flex: 1 1 auto; min-width: 0; max-width: 800px; width: 100%; aspect-ratio: 16 / 9; height: auto; border-radius: 10px; touch-action: none; background: #000; align-self: flex-start; }
.mg-info { width: 300px; flex: none; overflow-y: auto; font-size: 14px; max-height: 60vh; }
.mg-sec { background: var(--panel2); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
.mg-sec .hint { margin: 4px 0 0; padding-left: 18px; }
.mg-sec .hint li { margin: 2px 0; }
.res-row { display: flex; gap: 14px; }
.mg-log div { font-size: 13px; padding: 4px 8px; border-left: 3px solid var(--line); margin-bottom: 4px; }
.mg-log div:first-child { border-color: var(--accent); background: #0003; }
.mg-log .good { border-color: var(--good) !important; color: var(--good); }
.mg-log .bad { border-color: var(--bad) !important; color: #ff8a80; }
.mg-log .warn { border-color: var(--gold) !important; color: #ffe082; }
.mg-btns { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 12px 12px; }
.mg-btns .btn { font-size: 15px; padding: 10px 16px; }
.mg-sliders { display: flex; flex-direction: column; gap: 10px; background: var(--panel2); border-radius: 10px; padding: 10px; }
.mg-sliders label { display: flex; flex-direction: column; gap: 6px; }
.mg-sliders input { width: 100%; }
@media (max-width: 900px) {
  .mg-main { flex-direction: column; overflow-y: auto; }
  .mg-info { width: 100%; max-height: none; }
  #mg-canvas { max-width: 100%; }
}

#toasts { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); align-items: center; display: flex; flex-direction: column; gap: 8px; z-index: 80; pointer-events: none; max-width: min(360px, calc(100vw - 24px)); }
.toast { background: #1f2c48f2; border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 20px #0008; animation: slide .25s ease-out; transition: opacity .4s, transform .4s; }
.toast.good { border-left-color: var(--good); }
.toast.bad { border-left-color: var(--bad); }
.toast.ach { border-left-color: var(--gold); background: #3a3010f2; }
.toast.out { opacity: 0; transform: translateY(-20px); }
@keyframes slide { from { transform: translateY(-20px); opacity: 0; } }

/* телефон горизонтально: мини-игра должна влезать по высоте */
@media (max-height: 540px) {
  .overlay { padding: 4px; }
  .mg-head { padding: 4px 10px; }
  .mg-head h2 { font-size: 15px; }
  .mg-main { flex-direction: row; padding: 6px; gap: 6px; overflow: hidden; }
  #mg-canvas { width: auto; height: calc(100vh - 110px); max-width: 64vw; }
  .mg-info { width: auto; flex: 1; min-width: 150px; max-height: calc(100vh - 110px); font-size: 12px; }
  .mg-btns { padding: 4px 8px 6px; gap: 5px; }
  .mg-btns .btn { padding: 6px 10px; font-size: 13px; }
  .topbar { padding: 6px 12px; }
  .g-body { padding: 8px 10px 30px; }
}

</style>
</head>
<body>
<div id="app">

  <!-- Титульный экран -->
  <section id="scr-title" class="screen active">
    <div class="title-snow"></div>
    <div class="title-box">
      <div class="title-icon">🛷</div>
      <h1>СНЕГОКАТ</h1>
      <p class="sub">гаражный тюнинг · горки · сальто · бензопила</p>
      <button id="t-continue" class="btn big primary">▶ Играть</button>

    <main id="g-body" class="g-body"></main>

  <!-- Горка -->
  <section id="scr-ride" class="screen">

    <div class="ride-top">
      <button id="r-garage" class="btn">🏠 Гараж</button>
      <button id="r-build" class="btn">🪏 Стройка</button>
      <button id="r-night" class="btn">🌙 Ночь</button>
      <button id="r-light" class="btn">🔦</button>
      <button id="r-restart" class="btn">↺</button>
    </div>
    <div id="build-bar" class="build-bar hidden">
      <button data-tool="raise">⬆️ Насыпать</button>
      <button data-tool="dig">⬇️ Копать</button>
      <button data-tool="smooth">〰️ Сгладить</button>
      <button data-tool="kicker">📐 Кикер</button>
      <button data-tool="bigkicker">🚀 Большой кикер</button>
      <button data-tool="landing">🛬 Приземлялка</button>
      <button data-tool="ice">🧊 Залить лёд</button>
      <button data-tool="unice">❄️ Убрать лёд</button>
      <span class="snow">❄️ Снег: <b id="b-snow">0</b></span>
      <button id="b-left">◀</button><button id="b-right">▶</button>
      <button id="b-reset" class="danger">Сброс</button>
    </div>
    <div id="touch" class="touch hidden">
      <div class="tl">
        <button data-k="left">⟲</button>
        <button data-k="right">⟳</button>
      </div>
      <div class="tc">
        <button data-k="KeyZ">🦸</button>
        <button data-k="KeyX">🙌</button>
        <button data-k="KeyC">🦵</button>
        <button data-k="KeyV">🤸</button>
        <button data-k="sigL" data-need="turn">◀️</button>
        <button data-k="horn" data-need="horn">📯</button>
        <button data-k="sigR" data-need="turn">▶️</button>
      </div>
      <div class="tr">
        <button data-k="brake" class="sm">тормоз</button>
        <button data-k="gas" data-need="motor" class="sm">газ</button>
        <button data-k="push" class="wide">толчок</button>
      </div>
    </div>
  </section>
</div>

<!-- Мини-игры -->
<div id="mg" class="overlay hidden">
  <div class="mg-win">
    <div class="mg-head"><h2 id="mg-title"></h2><button id="mg-close" class="btn">✕ Выйти</button></div>
    <div class="mg-main">
      <canvas id="mg-canvas" width="800" height="450"></canvas>
      <div id="mg-info" class="mg-info"></div>
    </div>
    <div id="mg-btns" class="mg-btns"></div>
  </div>
</div>

<!-- Модалка -->
<div id="modal" class="overlay hidden">
  <div class="modal-win">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div id="modal-btns" class="modal-btns"></div>
  </div>
</div>
<div id="toasts"></div>

<script>
'use strict';
// ===== Общие помощники =====
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const TAU = Math.PI * 2;

function wrapAngle(a) {
  a = (a + Math.PI) % TAU;
  if (a < 0) a += TAU;
  return a - Math.PI;
}
function fmt(n) { return Math.floor(n).toLocaleString('ru-RU'); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
function distToSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy || 1;
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
  return { d: Math.hypot(px - (ax + dx * t), py - (ay + dy * t)), t };
}
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

<script>
'use strict';
// ===== Игровые данные: предметы, схемы, достижения, этапы мотора =====

const CATS = {

<script>
'use strict';
// ===== Сохранение прогресса (localStorage) =====
const SAVE_KEY = 'snegokat_save_v1';
let S = null;

function defaultSave() {
  return {
    v: 1,
    coins: 150,
    // стартовый набор от деда: всё на первую фару
    inv: { solder: 12, wire: 6, battery: 1, switch: 1, led_w: 1 },
    tools: { iron: true },
    mods: {},
    modOn: { headlight: true, underglow: true, speaker: true },
    paint: '#e53935',
    glow: '#00e5ff',
    motor: { stage: 0, done: false, health: 100 },
    tank: { fuel: 0, oil: 0 },
    terrain: null,
    ice: null,
    snow: 600,
    snowMoved: 0,
    stats: { runs: 0, best: 0, bestAir: 0, bestDist: 0, maxSpeed: 0, flips: 0, earned: 0, crashes: 0, solders: 0, playTime: 0 },
    ach: {},
    settings: { sound: true, music: true, night: false },
    created: Date.now(),
    saved: 0,
  };
}

function deepMerge(base, data) {
  for (const k in data) {
    if (data[k] && typeof data[k] === 'object' && !Array.isArray(data[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
      deepMerge(base[k], data[k]);
    } else {
      base[k] = data[k];
    }
  }
  return base;
}

const Save = {
  timer: null,
  has() {
    try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  },
  load() {
    S = defaultSave();
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) deepMerge(S, JSON.parse(raw));
    } catch (e) { console.warn('save load failed', e); }
    return S;
  },
  save() {
    if (!S) return;
    clearTimeout(this.timer); this.timer = null;
    S.saved = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { console.warn('save failed', e); }
  },
  dirty() {
    if (this.timer) return;
    this.timer = setTimeout(() => this.save(), 400);
  },
  reset() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    S = defaultSave();
    this.save();
  },
  exportCode() {
    return btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  },
  importCode(code) {
    const data = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if (!data || typeof data !== 'object' || data.v !== 1) throw new Error('bad save');
    S = deepMerge(defaultSave(), data);
    this.save();
  },
};

// сохраняемся при выходе / сворачивании
window.addEventListener('beforeunload', () => { if (typeof Ride !== 'undefined') Ride.persist(); Save.save(); });
window.addEventListener('pagehide', () => { if (typeof Ride !== 'undefined') Ride.persist(); Save.save(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (typeof Ride !== 'undefined') Ride.persist(); Save.save(); }
});
setInterval(() => { if (S) { S.stats.playTime += 5; Save.save(); } }, 5000);

<script>
'use strict';
// ===== Звук на WebAudio (без файлов) =====
const Sfx = {
  ctx: null, master: null, noiseBuf: null,
  engine: null, sizzle: null, musicTimer: null, alarmTimer: null,

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.45;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  ok() { return this.ctx && S && S.settings.sound; },

  tone(f, d = 0.1, type = 'square', v = 0.15, slide = 0, delay = 0) {
    if (!this.ok()) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + d + 0.02);
  },
  noise(d = 0.2, v = 0.3, freq = 1000, type = 'lowpass', delay = 0) {
    if (!this.ok()) return;
    const t = this.ctx.currentTime + delay;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t, Math.random() * 0.5); s.stop(t + d + 0.02);
  },

  click() { this.tone(900, 0.04, 'square', 0.05); },
  coin() { this.tone(988, 0.08, 'square', 0.1); this.tone(1319, 0.18, 'square', 0.1, 0, 0.08); },
  buy() { this.tone(660, 0.06, 'triangle', 0.15); this.tone(880, 0.12, 'triangle', 0.15, 0, 0.06); },
  error() { this.tone(200, 0.15, 'sawtooth', 0.1); this.tone(150, 0.2, 'sawtooth', 0.1, 0, 0.12); },
  success() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.15, 'triangle', 0.15, 0, i * 0.09)); },
  land(hard = 0.5) { this.noise(0.25, 0.25 + hard * 0.3, 500); },
  whoosh() { this.noise(0.4, 0.15, 1800, 'bandpass'); },
  crash() { this.noise(0.6, 0.5, 400); this.tone(120, 0.4, 'sawtooth', 0.12, -60); },
  trick() { this.tone(700, 0.08, 'triangle', 0.12, 300); },
  spark() { this.noise(0.12, 0.25, 4000, 'highpass'); },
  bang() { this.noise(0.5, 0.6, 2500); this.tone(80, 0.4, 'square', 0.2, -40); },
  pop() { this.noise(0.12, 0.5, 900); this.tone(90, 0.1, 'square', 0.15); },
  ratchet() { this.tone(300 + Math.random() * 80, 0.03, 'square', 0.06); },
  hornTone() { this.tone(440, 0.25, 'square', 0.12); this.tone(554, 0.25, 'square', 0.1); },
  alarm(dur = 2.5) {
    if (!this.ok()) return;
    for (let i = 0; i < dur * 4; i++) this.tone(i % 2 ? 1400 : 900, 0.24, 'square', 0.08, i % 2 ? -500 : 500, i * 0.25);
  },

  // непрерывный шипящий звук паяльника
  setSizzle(on) {
    if (!this.ok()) on = false;
    if (on && !this.sizzle) {
      const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
      const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 3500;
      const g = this.ctx.createGain(); g.gain.value = 0.08;
      s.connect(f); f.connect(g); g.connect(this.master); s.start();
      this.sizzle = { s, g };
    } else if (!on && this.sizzle) {
      try { this.sizzle.s.stop(); } catch (e) {}
      this.sizzle = null;
    }
  },

  // мотор: rpm 0..1, run — работает ли
  setEngine(run, rpm = 0) {
    if (!this.ok()) run = false;
    if (run && !this.engine) {
      const c = this.ctx;
      const o1 = c.createOscillator(); o1.type = 'sawtooth';
      const o2 = c.createOscillator(); o2.type = 'square';
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
      const g = c.createGain(); g.gain.value = 0;
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(this.master);
      o1.start(); o2.start();
      this.engine = { o1, o2, f, g };
    }
    if (!this.engine) return;
    const t = this.ctx.currentTime;
    if (!run) {
      this.engine.g.gain.setTargetAtTime(0, t, 0.05);
      const e = this.engine; this.engine = null;
      setTimeout(() => { try { e.o1.stop(); e.o2.stop(); } catch (er) {} }, 300);
      return;
    }
    const base = 38 + rpm * 160 + Math.random() * 4;
    this.engine.o1.frequency.setTargetAtTime(base, t, 0.04);
    this.engine.o2.frequency.setTargetAtTime(base * 0.5, t, 0.04);
    this.engine.f.frequency.setTargetAtTime(500 + rpm * 1800, t, 0.05);
    this.engine.g.gain.setTargetAtTime(0.06 + rpm * 0.06, t, 0.05);
  },

  // простенькая чиптюн-музыка из колонки
  startMusic() {
    if (this.musicTimer || !this.ok() || !S.settings.music) return;
    const mel = [76, 0, 79, 76, 74, 72, 74, 76, 0, 72, 69, 72, 74, 0, 71, 67, 76, 0, 79, 81, 79, 76, 74, 72, 74, 76, 79, 76, 74, 72, 0, 0];
    const bass = [45, 45, 52, 52, 41, 41, 48, 48];
    let step = 0;
    const midi = n => 440 * Math.pow(2, (n - 69) / 12);
    this.musicTimer = setInterval(() => {
      if (!this.ok()) return;
      const n = mel[step % mel.length];
      if (n) this.tone(midi(n), 0.16, 'square', 0.035);
      if (step % 4 === 0) this.tone(midi(bass[(step / 4) % bass.length]), 0.3, 'triangle', 0.08);
      if (step % 2 === 0) this.noise(0.04, 0.04, 6000, 'highpass');
      step++;
    }, 150);
  },
  stopMusic() { clearInterval(this.musicTimer); this.musicTimer = null; },
};

</script>
<script>
'use strict';
// ===== Тосты, модальные окна, раннер мини-игр =====
const UI = {
  toast(msg, type = '') {
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.innerHTML = msg;
    $('#toasts').appendChild(t);
    setTimeout(() => t.classList.add('out'), 2600);
    setTimeout(() => t.remove(), 3100);
  },
  // buttons: [{label, cls, onClick, keep}]
  modal(title, html, buttons = [{ label: 'OK' }]) {
    $('#modal-title').innerHTML = title;
    $('#modal-body').innerHTML = html;
    const box = $('#modal-btns');
    box.innerHTML = '';
    buttons.forEach(b => {
      const el = document.createElement('button');
      el.className = 'btn ' + (b.cls || '');
      el.innerHTML = b.label;
      el.onclick = () => {
        Sfx.click();
        if (!b.keep) UI.closeModal();
        if (b.onClick) b.onClick();
      };
      box.appendChild(el);
    });
    $('#modal').classList.remove('hidden');
  },
  closeModal() { $('#modal').classList.add('hidden'); },
  modalOpen() { return !$('#modal').classList.contains('hidden'); },
};

// Раннер мини-игр: игра — объект с методами start(api), update(dt), draw(ctx), down/move/up(x,y), key(code), exit()
const MG = {
  game: null, raf: 0, last: 0,
  init() {
    this.cv = $('#mg-canvas');
    this.ctx = this.cv.getContext('2d');
    const pos = e => {
      const r = this.cv.getBoundingClientRect();
      return [(e.clientX - r.left) * this.cv.width / r.width, (e.clientY - r.top) * this.cv.height / r.height];
    };
    this.cv.addEventListener('pointerdown', e => {
      e.preventDefault();
      this.cv.setPointerCapture(e.pointerId);
      const [x, y] = pos(e);
      this.game && this.game.down && this.game.down(x, y);
    });
    this.cv.addEventListener('pointermove', e => {
      const [x, y] = pos(e);
      this.game && this.game.move && this.game.move(x, y, e.buttons > 0 || e.pointerType === 'touch');
    });
    const up = e => { const [x, y] = pos(e); this.game && this.game.up && this.game.up(x, y); };
    this.cv.addEventListener('pointerup', up);
    this.cv.addEventListener('pointercancel', up);
    $('#mg-close').onclick = () => this.close(true);
    window.addEventListener('keydown', e => {
      if (!this.game) return;
      if (e.code === 'Escape') { this.close(true); return; }
      if (this.game.key) { this.game.key(e.code); e.preventDefault(); }
    });
  },
  open(title, game) {
    this.game = game;
    $('#mg-title').textContent = title;
    $('#mg-info').innerHTML = '';
    $('#mg-btns').innerHTML = '';
    $('#mg').classList.remove('hidden');
    const api = {
      info: html => { $('#mg-info').innerHTML = html; },
      buttons: list => this.setButtons(list),
      close: () => this.close(false),
    };
    game.start(api);
    this.last = performance.now();
    cancelAnimationFrame(this.raf);
    const loop = now => {
      if (!this.game) return;
      const dt = Math.min(0.05, (now - this.last) / 1000);
      this.last = now;
      this.game.update && this.game.update(dt);
      this.ctx.setTransform(1, 0, 0, 1, 0, 0);
      this.game.draw(this.ctx);
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  },
  setButtons(list) {
    const box = $('#mg-btns');
    box.innerHTML = '';
    list.forEach(b => {
      const el = document.createElement('button');
      el.className = 'btn ' + (b.cls || '') + (b.active ? ' active' : '');
      el.innerHTML = b.label;
      el.disabled = !!b.disabled;
      if (b.hold) {
        el.addEventListener('pointerdown', e => { e.preventDefault(); b.hold(true); });
        ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => b.hold(false)));
      } else {
        el.onclick = () => { Sfx.click(); b.onClick && b.onClick(); };
      }
      box.appendChild(el);
    });
  },
  close(byUser) {
    if (!this.game) return;
    const g = this.game;
    this.game = null;
    cancelAnimationFrame(this.raf);
    Sfx.setSizzle(false);
    Sfx.setEngine(false);
    $('#mg').classList.add('hidden');
    if (g.exit) g.exit(byUser);
    Save.dirty();
    if (typeof Garage !== 'undefined') Garage.render();
  },
};

<script>
'use strict';
// ===== Рисование снегоката и наездника (локальные координаты, ось Y вверх, земля y=0) =====
const POSES = {
  sit:      { hip: [-16, 32], sh: [-6, 60], head: [-2, 72], el: [5, 50], hand: [14, 53], el2: [3, 49], hand2: [12, 52], kn: [6, 40], ft: [16, 28], kn2: [3, 38], ft2: [13, 27] },
  lean:     { hip: [-14, 32], sh: [2, 56], head: [8, 66], el: [8, 47], hand: [14, 53], el2: [6, 46], hand2: [12, 52], kn: [6, 40], ft: [16, 28], kn2: [3, 38], ft2: [13, 27] },
  back:     { hip: [-18, 32], sh: [-14, 60], head: [-12, 72], el: [0, 52], hand: [14, 53], el2: [-2, 51], hand2: [12, 52], kn: [6, 40], ft: [16, 28], kn2: [3, 38], ft2: [13, 27] },
  push:     { hip: [-16, 32], sh: [-4, 58], head: [0, 70], el: [5, 50], hand: [14, 53], el2: [3, 49], hand2: [12, 52], kn: [6, 40], ft: [16, 28], kn2: [-10, 18], ft2: [-18, 0] },
  superman: { hip: [-34, 52], sh: [-6, 57], head: [4, 62], el: [4, 52], hand: [14, 53], el2: [3, 51], hand2: [12, 52], kn: [-56, 55], ft: [-80, 58], kn2: [-56, 50], ft2: [-80, 52] },
  nohands:  { hip: [-16, 32], sh: [-8, 60], head: [-5, 72], el: [-1, 76], hand: [6, 92], el2: [-18, 74], hand2: [-24, 90], kn: [6, 40], ft: [16, 28], kn2: [3, 38], ft2: [13, 27] },
  kankan:   { hip: [-18, 32], sh: [-10, 60], head: [-7, 72], el: [5, 50], hand: [14, 53], el2: [3, 49], hand2: [12, 52], kn: [10, 54], ft: [32, 68], kn2: [3, 38], ft2: [13, 27] },
  split:    { hip: [-12, 42], sh: [-4, 68], head: [0, 80], el: [6, 58], hand: [14, 53], el2: [4, 57], hand2: [12, 52], kn: [10, 52], ft: [34, 62], kn2: [-34, 48], ft2: [-58, 58] },
  sprawl:   { hip: [0, 0], sh: [26, 0], head: [38, 2], el: [30, 14], hand: [40, 22], el2: [30, -14], hand2: [40, -22], kn: [-20, 8], ft: [-40, 14], kn2: [-20, -8], ft2: [-40, -14] },
};
const JOINTS = Object.keys(POSES.sit);

const Sled = {
  makeJoints(pose = 'sit') {
    const j = {};
    for (const k of JOINTS) j[k] = POSES[pose][k].slice();
    return j;
  },
  blendJoints(j, pose, k) {
    const t = POSES[pose] || POSES.sit;
    for (const n of JOINTS) {
      j[n][0] = lerp(j[n][0], t[n][0], k);
      j[n][1] = lerp(j[n][1], t[n][1], k);
    }
  },

  // o: {t, joints, mods, paint, glow, lights:{head,left,right,brake}, wheelRot, throttle, noRider, alarmBlink}
  draw(ctx, o) {
    const m = o.mods || {};
    const L = o.lights || {};
    const t = o.t || 0;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // --- подсветка днища
    if (m.underglow && L.glow) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(-10, 4, 2, -10, 4, 70);
      const pulse = 0.75 + 0.25 * Math.sin(t * 3);
      g.addColorStop(0, hexA(o.glow, 0.9 * pulse));
      g.addColorStop(0.5, hexA(o.glow, 0.35 * pulse));
      g.addColorStop(1, hexA(o.glow, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(-10, 4, 70, 18, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    // --- мотор и колесо (сзади)
    if (m.motor) {
      // кронштейны
      ctx.strokeStyle = '#455a64'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-36, 22); ctx.lineTo(-50, 10); ctx.moveTo(-38, 30); ctx.lineTo(-56, 26); ctx.stroke();
      // колесо
      ctx.save();
      ctx.translate(-50, 10);
      ctx.fillStyle = '#212121';
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();
      ctx.rotate(-(o.wheelRot || 0));
      ctx.strokeStyle = '#9e9e9e'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 8; i++) {
        const a = i * TAU / 8;
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * 11, Math.sin(a) * 11); ctx.lineTo(Math.cos(a) * 14, Math.sin(a) * 14); ctx.stroke();
      }
      ctx.fillStyle = '#757575';
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#424242'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(4, 0); ctx.stroke();
      ctx.restore();
      // цепь
      ctx.strokeStyle = '#616161'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-52, 34); ctx.lineTo(-56, 12); ctx.moveTo(-46, 34); ctx.lineTo(-44, 12); ctx.stroke();
      // корпус пилы
      const shake = o.throttle ? Math.sin(t * 90) * 0.6 : (o.engineOn ? Math.sin(t * 60) * 0.3 : 0);
      ctx.save(); ctx.translate(0, shake);
      ctx.fillStyle = '#ff6d00';
      roundRect(ctx, -66, 24, 30, 20, 4); ctx.fill();
      ctx.fillStyle = '#263238';
      for (let i = 0; i < 4; i++) { ctx.fillRect(-60 + i * 5, 44, 3, 6); }
      ctx.fillStyle = '#37474f'; ctx.fillRect(-64, 26, 8, 8);
      ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-68, 38); ctx.lineTo(-72, 40); ctx.stroke(); // стартер
      ctx.strokeStyle = '#9e9e9e'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-66, 28); ctx.lineTo(-76, 26); ctx.stroke(); // глушитель
      ctx.restore();
    }

    // --- задний полоз и передняя лыжа
    ctx.strokeStyle = '#263238';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-46, 6); ctx.quadraticCurveTo(-44, 2, -38, 2); ctx.lineTo(-2, 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, 2); ctx.lineTo(38, 2); ctx.quadraticCurveTo(48, 2, 50, 11); ctx.stroke();

    // --- задняя нога наездника (за рамой)
    const J = o.joints;
    if (J && !o.noRider) this.drawLimb(ctx, J.hip, J.kn2, J.ft2, '#1a237e', 7);

    // --- рама
    ctx.strokeStyle = o.paint || '#e53935';
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.moveTo(-34, 3); ctx.lineTo(-30, 22);
    ctx.moveTo(-8, 3); ctx.lineTo(-10, 22);
    ctx.moveTo(-38, 22); ctx.lineTo(0, 22); ctx.lineTo(18, 30);
    ctx.moveTo(22, 3); ctx.lineTo(14, 52);
    ctx.stroke();
    ctx.strokeStyle = '#37474f'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(16, 3); ctx.lineTo(28, 3); ctx.stroke();
    // руль
    ctx.strokeStyle = '#263238'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(8, 52); ctx.lineTo(20, 55); ctx.stroke();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(15, 54); ctx.lineTo(20, 55); ctx.stroke();
    // сиденье
    ctx.fillStyle = '#3e2723';
    roundRect(ctx, -38, 22, 34, 7, 3); ctx.fill();

    // --- электроника
    if (m.speaker) {
      ctx.fillStyle = '#37474f'; roundRect(ctx, -30, 8, 15, 12, 2); ctx.fill();
      ctx.fillStyle = '#90a4ae'; ctx.beginPath(); ctx.arc(-22.5, 14, 4 + (o.music ? Math.abs(Math.sin(t * 16)) : 0), 0, TAU); ctx.fill();
    }
    if (m.horn) { ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(9, 28, 3.5, 0, TAU); ctx.fill(); }
    if (m.alarm) {
      const on = o.alarmBlink && Math.sin(t * 4) > 0.6;
      this.lamp(ctx, -13, 25, 2, on ? '#ff1744' : '#5d0000', on);
    }
    if (m.speedo) {
      ctx.fillStyle = '#111'; roundRect(ctx, 7, 56, 10, 6, 1.5); ctx.fill();
      ctx.fillStyle = '#00e676'; ctx.fillRect(8.5, 58, 7, 2);
    }
    if (m.stoplight) {
      ctx.fillStyle = '#333'; ctx.fillRect(-44, 17, 5, 7);
      this.lamp(ctx, -41.5, 20.5, 2.5, L.brake ? '#ff1744' : (L.head ? '#b71c1c' : '#5d0000'), L.brake);
    }
    if (m.turn) {
      const blink = Math.sin(t * 14) > 0;
      this.lamp(ctx, 21, 34, 2.4, L.left && blink ? '#ffab00' : '#6d4c00', L.left && blink);
      this.lamp(ctx, -40, 27, 2.4, L.right && blink ? '#ffab00' : '#6d4c00', L.right && blink);
    }
    if (m.headlight) {
      ctx.fillStyle = '#424242'; roundRect(ctx, 15, 40, 9, 8, 2); ctx.fill();
      this.lamp(ctx, 24.5, 44, 3, L.head ? '#fffde7' : '#9e9e9e', L.head, 16);
    }

    // --- наездник
    if (J && !o.noRider) this.drawRider(ctx, J, false);
    ctx.restore();
  },

  lamp(ctx, x, y, r, color, glow, glowR = 9) {
    if (glow) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(x, y, 0, x, y, glowR);
      g.addColorStop(0, hexA(color, 0.9)); g.addColorStop(1, hexA(color, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, glowR, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  },

  drawLimb(ctx, a, b, c, color, w) {
    ctx.strokeStyle = color; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.stroke();
    // ботинок
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(c[0], c[1], w * 0.55, 0, TAU); ctx.fill();
  },

  drawRider(ctx, J, withBackLeg) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (withBackLeg) this.drawLimb(ctx, J.hip, J.kn2, J.ft2, '#1a237e', 7);
    // задняя рука
    ctx.strokeStyle = '#0d47a1'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(J.sh[0], J.sh[1]); ctx.lineTo(J.el2[0], J.el2[1]); ctx.lineTo(J.hand2[0], J.hand2[1]); ctx.stroke();
    // туловище (куртка)
    ctx.strokeStyle = '#1976d2'; ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(J.hip[0], J.hip[1]); ctx.lineTo(J.sh[0], J.sh[1]); ctx.stroke();
    // передняя нога
    this.drawLimb(ctx, J.hip, J.kn, J.ft, '#283593', 7.5);
    // шарф
    ctx.strokeStyle = '#fdd835'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(J.sh[0] - 2, J.sh[1] + 2); ctx.lineTo(J.sh[0] + 3, J.sh[1] + 3); ctx.stroke();
    // голова
    const hx = J.head[0], hy = J.head[1];
    ctx.fillStyle = '#ffcc99';
    ctx.beginPath(); ctx.arc(hx, hy, 7.5, 0, TAU); ctx.fill();
    // шапка с помпоном
    const ang = Math.atan2(hy - J.sh[1], hx - J.sh[0]) - Math.PI / 2;
    ctx.save(); ctx.translate(hx, hy); ctx.rotate(ang);
    ctx.fillStyle = '#e53935';
    ctx.beginPath(); ctx.arc(0, 1, 8, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-8.5, 0, 17, 3);
    ctx.beginPath(); ctx.arc(-2, 10, 3.5, 0, TAU); ctx.fill();
    // глаз
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(4, -2, 1.2, 0, TAU); ctx.fill();
    ctx.restore();
    // передняя рука (варежка)
    ctx.strokeStyle = '#1565c0'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(J.sh[0], J.sh[1]); ctx.lineTo(J.el[0], J.el[1]); ctx.lineTo(J.hand[0], J.hand[1]); ctx.stroke();
    ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.arc(J.hand[0], J.hand[1], 3.5, 0, TAU); ctx.fill();
  },
};

</script>
<script>
'use strict';
// ===== Мини-игра «Пайка»: соединяем выводы проводами, паяем точки, включаем =====

// типы компонентов: размеры и выводы (смещения от центра)
const CT = {
  battery: { name: 'Аккумулятор', w: 130, h: 46, pins: { '+': [80, 0], '-': [-80, 0] }, pol: true },
  switch: { name: 'Тумблер', w: 64, h: 44, pins: { '1': [-20, 36], '2': [20, 36] }, closes: ['1', '2'] },
  tact: { name: 'Кнопка', w: 44, h: 44, pins: { '1': [-34, 0], '2': [34, 0] }, closes: ['1', '2'] },
  led: { name: 'Светодиод', w: 34, h: 40, pins: { 'A': [-11, 42], 'K': [11, 38] }, pol: true },
  res: { name: 'Резистор', w: 60, h: 18, pins: { '1': [-46, 0], '2': [46, 0] } },
  strip: { name: 'LED-лента', w: 220, h: 30, pins: { '+': [-124, -12], '-': [-124, 12] }, pol: true },
  buzzer: { name: 'Пищалка', w: 50, h: 50, pins: { '+': [-13, 40], '-': [13, 40] }, pol: true },
  tilt: { name: 'Датчик наклона', w: 54, h: 24, pins: { '1': [-40, 0], '2': [40, 0] }, closes: ['1', '2'] },
  micro: { name: 'Концевик', w: 52, h: 32, pins: { '1': [-17, 30], '2': [17, 30] }, closes: ['1', '2'] },
  mcu: { name: 'Ардуинка', w: 220, h: 70, pins: { VIN: [-90, 48], GND: [-54, 48], '5V': [-18, 48], D2: [18, 48], A4: [54, 48], A5: [90, 48] } },
  oled: { name: 'Дисплей', w: 130, h: 70, pins: { VCC: [-45, 48], GND: [-15, 48], SCL: [15, 48], SDA: [45, 48] } },
  hall: { name: 'Датчик Холла', w: 70, h: 28, pins: { VCC: [-22, 32], GND: [0, 32], OUT: [22, 32] } },
  bt: { name: 'BT-модуль', w: 100, h: 50, pins: { VCC: [-30, 38], GND: [0, 38], OUT: [30, 38] } },
  amp: { name: 'Усилитель', w: 120, h: 56, pins: { VCC: [-42, -41], GND: [-14, -41], IN: [14, -41], 'O+': [-20, 41], 'O-': [20, 41] } },
  spk: { name: 'Динамик', w: 74, h: 74, pins: { '+': [-15, 50], '-': [15, 50] }, pol: true },
};
const PIN_LABEL = {
  battery: { '+': '+', '-': '−' }, led: { A: 'A+', K: 'K−' }, buzzer: { '+': '+', '-': '−' }, strip: { '+': '+', '-': '−' },
  spk: { '+': '+', '-': '−' }, amp: { 'O-': 'O−' },
};
// какая деталь магазина соответствует компоненту (для «сгорело — нужна новая»)
const COMP_ITEM = { battery: 'battery', led: null, buzzer: 'buzzer' };

class SolderGame {
  constructor(p) {
    this.p = p;
    this.comps = p.comps.map(c => ({ ...c, T: CT[c.t], burnt: false }));
    this.wires = [];
    this.joints = {};
    this.tool = 'wire';
    this.pending = null;
    this.mouse = { x: -100, y: -100 };
    this.heating = null;
    this.fx = [];
    this.t = 0;
    this.lit = false;
    this.flags = {};
    this.done = false;
    this.log = [];
    this.station = !!S.tools.station;
    this.colorIdx = 0;
    this.colors = ['#e53935', '#212121', '#fdd835', '#43a047', '#1e88e5', '#fb8c00', '#8e24aa', '#00acc1'];
  }

  start(api) {
    this.api = api;
    this.say('Выбери «Провод» и соедини выводы. Потом пропаяй каждую точку паяльником и жми «Включить».');
    this.refresh();
  }

  say(msg, cls = '') {
    this.log.unshift({ msg, cls });
    this.log = this.log.slice(0, 4);
    this.refresh();
  }

  refresh() {
    const p = this.p;
    const html = `
      <div class="mg-sec"><b>${p.icon} ${p.name}</b><div class="small">${p.desc}</div></div>
      <div class="mg-sec"><b>Схема:</b><ol class="hint">${p.hint.map(h => `<li>${h}</li>`).join('')}</ol></div>
      <div class="mg-sec res-row"><span>〽️ Провода: <b>${S.inv.wire || 0}</b></span><span>🧵 Припой: <b>${S.inv.solder || 0}</b></span></div>
      <div class="mg-sec small">${this.tool === 'iron'
        ? '🔥 Зажми точку и отпусти, когда стрелка в <span style="color:#69f0ae">зелёной зоне</span>. Рано — холодная пайка, поздно — перегрев.'
        : this.tool === 'cut' ? '✂️ Нажми на провод, чтобы его убрать.' : '〽️ Нажми на вывод, потом на другой вывод.'}</div>
      <div class="mg-log">${this.log.map(l => `<div class="${l.cls}">${l.msg}</div>`).join('')}</div>`;
    this.api.info(html);
    const btns = [
      { label: '〽️ Провод', active: this.tool === 'wire', onClick: () => { this.tool = 'wire'; this.pending = null; this.refresh(); } },
      { label: '🔥 Паяльник', active: this.tool === 'iron', onClick: () => { this.tool = 'iron'; this.pending = null; this.refresh(); } },
      { label: '✂️ Убрать', active: this.tool === 'cut', onClick: () => { this.tool = 'cut'; this.pending = null; this.refresh(); } },
    ];
    if (S.tools.multimeter) btns.push({ label: '📟 Прозвонить', onClick: () => this.test(true) });
    btns.push({ label: '⚡ Включить', cls: 'primary', onClick: () => this.test(false) });
    if (this.done) {
      this.api.buttons([{ label: '✅ Поставить на снегокат', cls: 'primary', onClick: () => this.install() }]);
    } else this.api.buttons(btns);
  }

  pinPos(key) {
    const [cid, pin] = key.split('.');
    const c = this.comps.find(c => c.id === cid);
    const o = c.T.pins[pin];
    return [c.x + o[0], c.y + o[1]];
  }
  allPins() {
    const out = [];
    for (const c of this.comps) for (const pin in c.T.pins) {
      const o = c.T.pins[pin];
      out.push({ key: c.id + '.' + pin, x: c.x + o[0], y: c.y + o[1], c, pin });
    }
    return out;
  }
  pinAt(x, y, r = 17) {
    let best = null, bd = r;
    for (const p of this.allPins()) {
      const d = dist(x, y, p.x, p.y);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }
  pinName(key) {
    const [cid, pin] = key.split('.');
    const c = this.comps.find(c => c.id === cid);
    const lab = (PIN_LABEL[c.t] && PIN_LABEL[c.t][pin]) || pin;
    return `${c.label || c.T.name} [${lab}]`;
  }
  wirePath(w) {
    const [ax, ay] = this.pinPos(w.a), [bx, by] = this.pinPos(w.b);
    const mx = (ax + bx) / 2, my = (ay + by) / 2 + Math.min(60, dist(ax, ay, bx, by) * 0.18);
    return [ax, ay, mx, my, bx, by];
  }
  wireAt(x, y) {
    for (const w of this.wires) {
      const [ax, ay, mx, my, bx, by] = this.wirePath(w);
      for (let i = 0; i <= 20; i++) {
        const t = i / 20, u = 1 - t;
        const px = u * u * ax + 2 * u * t * mx + t * t * bx, py = u * u * ay + 2 * u * t * my + t * t * by;
        if (dist(x, y, px, py) < 9) return w;
      }
    }
    return null;
  }
  wiresAt(key) { return this.wires.filter(w => w.a === key || w.b === key); }

  // ---------- ввод
  down(x, y) {
    if (this.done) return;
    this.mouse.x = x; this.mouse.y = y;
    const pin = this.pinAt(x, y);
    if (this.tool === 'wire') {
      if (!pin) { this.pending = null; return; }
      if (this.pending && this.pending !== pin.key) { this.connect(this.pending, pin.key); this.pending = null; }
      else { this.pending = pin.key; this.dragStart = pin.key; Sfx.click(); }
    } else if (this.tool === 'iron') {
      if (!pin) return;
      if (!this.joints[pin.key]) { this.say('Сначала подведи к этому выводу провод.', 'warn'); return; }
      if ((S.inv.solder || 0) <= 0) { this.say('Кончился припой! Купи в магазине.', 'bad'); Sfx.error(); return; }
      S.inv.solder--; Save.dirty();
      const j = this.joints[pin.key];
      const w = this.station ? 0.26 : 0.17;
      const c = rand(0.5, 0.78);
      j.zone = [c - w / 2, c + w / 2];
      j.heat = 0;
      j.state = 'none';
      this.heating = pin.key;
      Sfx.setSizzle(true);
      this.refresh();
    } else if (this.tool === 'cut') {
      const w = this.wireAt(x, y);
      if (w) {
        this.wires.splice(this.wires.indexOf(w), 1);
        S.inv.wire = (S.inv.wire || 0) + 1;
        for (const k of [w.a, w.b]) if (!this.wiresAt(k).length) delete this.joints[k];
          else if (this.joints[k]) this.joints[k].state = 'none';
        Sfx.click();
        this.lit = false;
        this.refresh();
      }
    }
  }
  move(x, y) { this.mouse.x = x; this.mouse.y = y; }
  up(x, y) {
    if (this.tool === 'wire' && this.dragStart) {
      const pin = this.pinAt(x, y);
      if (pin && pin.key !== this.dragStart) { this.connect(this.dragStart, pin.key); this.pending = null; }
      this.dragStart = null;
    }
    if (this.heating) this.finishJoint();
  }

  connect(a, b) {
    if (a.split('.')[0] === b.split('.')[0]) { this.say('Выводы одной детали соединять нельзя — это закоротит её.', 'warn'); return; }
    if (this.wires.some(w => (w.a === a && w.b === b) || (w.a === b && w.b === a))) { this.say('Такой провод уже есть.', 'warn'); return; }
    if ((S.inv.wire || 0) <= 0) { this.say('Кончились провода! Купи в магазине.', 'bad'); Sfx.error(); return; }
    S.inv.wire--; Save.dirty();
    this.wires.push({ a, b, color: this.colors[this.colorIdx++ % this.colors.length] });
    for (const k of [a, b]) {
      if (!this.joints[k]) this.joints[k] = { state: 'none', heat: 0 };
      else this.joints[k].state = 'none'; // новый провод — надо перепаять точку
    }
    this.lit = false;
    Sfx.click();
    this.refresh();
  }

  finishJoint() {
    const key = this.heating;
    this.heating = null;
    Sfx.setSizzle(false);
    const j = this.joints[key];
    if (!j) return;
    const [px, py] = this.pinPos(key);
    if (j.heat < j.zone[0]) { j.state = 'cold'; this.say('Холодная пайка — серый комок. Перепаяй!', 'warn'); }
    else if (j.heat <= j.zone[1]) {
      j.state = 'good';
      Sfx.tone(1200, 0.06, 'sine', 0.08);
      for (let i = 0; i < 6; i++) this.fx.push({ x: px, y: py, vx: rand(-20, 20), vy: rand(-60, -20), life: 0.8, type: 'smoke' });
    } else { j.state = 'burnt'; this.say('Перегрел — изоляция поплавилась. Перепаяй!', 'warn'); }
    this.refresh();
  }

  update(dt) {
    this.t += dt;
    if (this.heating) {
      const j = this.joints[this.heating];
      j.heat += dt * (this.station ? 0.55 : 0.62);
      const [px, py] = this.pinPos(this.heating);
      if (Math.random() < 0.5) this.fx.push({ x: px + rand(-4, 4), y: py, vx: rand(-15, 15), vy: rand(-50, -25), life: 1, type: 'smoke' });
      if (j.heat >= 1.05) this.finishJoint();
    }
    for (const f of this.fx) { f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt; if (f.type === 'spark') f.vy += 300 * dt; }
    this.fx = this.fx.filter(f => f.life > 0);
  }

  // ---------- проверка схемы
  analyze() {
    const parent = {};
    const find = k => { while (parent[k] && parent[k] !== k) k = parent[k]; return k; };
    const uni = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; };
    const pins = this.allPins().map(p => p.key);
    const good = k => this.joints[k] && this.joints[k].state === 'good';
    const reset = () => pins.forEach(k => parent[k] = k);
    reset();
    for (const w of this.wires) if (good(w.a) && good(w.b)) uni(w.a, w.b);
    const wiring = {}; pins.forEach(k => wiring[k] = find(k));
    // с замкнутыми выключателями — для поиска КЗ
    for (const c of this.comps) if (c.T.closes) uni(c.id + '.' + c.T.closes[0], c.id + '.' + c.T.closes[1]);
    const power = {}; pins.forEach(k => power[k] = find(k));
    // «полная» проводка без учёта качества пайки (для подсказок)
    reset();
    for (const w of this.wires) uni(w.a, w.b);
    const raw = {}; pins.forEach(k => raw[k] = find(k));
    return { wiring, power, raw };
  }

  matches(part, swap) {
    const m = k => (swap && swap[k]) || k;
    const nets = this.p.nets;
    for (const n of nets) for (let i = 1; i < n.length; i++) if (part[m(n[0])] !== part[m(n[i])]) return false;
    for (let a = 0; a < nets.length; a++) for (let b = a + 1; b < nets.length; b++)
      if (part[m(nets[a][0])] === part[m(nets[b][0])]) return false;
    return true;
  }

  test(dry) {
    if (this.done) return;
    const { wiring, power, raw } = this.analyze();
    const p = this.p;
    const marks = [];
    // 1. КЗ
    const bat = 'bat';
    if (power[bat + '.+'] === power[bat + '.-']) {
      if (dry) { this.say('📟 Пищит прозвонка между + и − ! Это КОРОТКОЕ ЗАМЫКАНИЕ. Не включай!', 'bad'); Sfx.tone(2000, 0.5, 'square', 0.08); return; }
      this.boom('bat');
      this.say('💥 КОРОТКОЕ ЗАМЫКАНИЕ! Аккумулятор вздулся и сгорел.', 'bad');
      App.ach('short');
      this.consumeBurnt('battery');
      return;
    }
    // 2. всё верно?
    if (this.matches(wiring)) {
      if (dry) { this.say('📟 Прозвонка: всё звонится как надо! Можно включать.', 'good'); Sfx.tone(1500, 0.15, 'sine', 0.1); return; }
      this.win();
      return;
    }
    // 3. полярность
    for (const c of this.comps) {
      if (!c.T.pol) continue;
      const ks = Object.keys(c.T.pins);
      const swap = { [c.id + '.' + ks[0]]: c.id + '.' + ks[1], [c.id + '.' + ks[1]]: c.id + '.' + ks[0] };
      if (this.matches(wiring, swap)) {
        this.say(`${dry ? '📟 ' : ''}${c.label || c.T.name}: перепутана полярность! ${c.t === 'led' ? 'Длинная нога (A) — к плюсу.' : c.t === 'battery' ? 'Перепутал + и − аккумулятора.' : 'Плюс к плюсу.'}`, 'warn');
        if (!dry) Sfx.error();
        return;
      }
    }
    // 4. лишние соединения (в т.ч. резистор в обход)
    const nets = p.nets;
    for (let a = 0; a < nets.length; a++) for (let b = a + 1; b < nets.length; b++) {
      if (wiring[nets[a][0]] !== wiring[nets[b][0]]) continue;
      const ra = this.comps.find(c => c.t === 'res' && (nets[a].includes(c.id + '.1') && nets[b].includes(c.id + '.2') || nets[a].includes(c.id + '.2') && nets[b].includes(c.id + '.1')));
      if (ra && !dry) {
        const led = this.comps.find(c => c.t === 'led' && (nets[a].concat(nets[b]).includes(c.id + '.A')));
        if (led) {
          this.boom(led.id);
          this.say(`💥 ${led.label || 'Светодиод'} вспыхнул и сгорел — ток пошёл в обход резистора!`, 'bad');
          const item = { '#ffffff': 'led_w', '#ff1744': 'led_r', '#ff9100': 'led_o' }[led.color] || 'led_r';
          this.consumeBurnt(item);
          return;
        }
      }
      this.say(`${dry ? '📟 ' : ''}Лишнее соединение: ${this.pinName(nets[a][0])} и ${this.pinName(nets[b][0])} не должны быть соединены.`, 'warn');
      marks.push(nets[a][0], nets[b][0]);
      this.marks = { keys: marks, t: 3 };
      if (!dry) Sfx.error();
      return;
    }
    // 5. не хватает соединений
    for (const n of nets) for (let i = 1; i < n.length; i++) {
      if (wiring[n[0]] === wiring[n[i]]) continue;
      if (raw[n[0]] === raw[n[i]]) {
        const bad = this.wires.flatMap(w => [w.a, w.b]).filter(k => this.joints[k] && this.joints[k].state !== 'good');
        this.say(`${dry ? '📟 ' : ''}Нет контакта: провод есть, но не пропаян или плохая пайка.`, 'warn');
        this.marks = { keys: bad, t: 3 };
      } else {
        this.say(`${dry ? '📟 ' : ''}Цепь не замкнута: нужно соединить ${this.pinName(n[0])} и ${this.pinName(n[i])}.`, 'warn');
        this.marks = { keys: [n[0], n[i]], t: 3 };
      }
      if (!dry) Sfx.error();
      return;
    }
  }

  boom(cid) {
    const c = this.comps.find(c => c.id === cid);
    c.burnt = true;
    Sfx.bang();
    for (let i = 0; i < 40; i++) this.fx.push({ x: c.x, y: c.y, vx: rand(-160, 160), vy: rand(-200, 40), life: rand(0.4, 1.2), type: 'spark' });
    for (let i = 0; i < 25; i++) this.fx.push({ x: c.x + rand(-20, 20), y: c.y, vx: rand(-20, 20), vy: rand(-60, -20), life: rand(1, 2.5), type: 'bigsmoke' });
  }
  consumeBurnt(item) {
    S.inv[item] = Math.max(0, (S.inv[item] || 0) - 1);
    Save.dirty();
    const need = this.p.parts[item] || 1;
    if ((S.inv[item] || 0) >= need) {
      setTimeout(() => {
        this.comps.forEach(c => { c.burnt = false; });
        this.say(`Поставил запасной ${ITEMS[item].name.toLowerCase()}. Исправь ошибку!`, '');
      }, 1500);
    } else {
      setTimeout(() => {
        UI.modal('Сгорело 🔥', `Нет запасного: <b>${ITEMS[item].name}</b>.<br>Купи новый в магазине и попробуй снова.`);
        MG.close(false);
      }, 1600);
    }
  }

  win() {
    this.lit = true;
    Sfx.success();
    if (this.p.id === 'horn' || this.p.id === 'alarm') Sfx.hornTone();
    if (this.p.firmware) {
      this.say('Схема ожила! Прошиваем ардуинку… ⏳', 'good');
      this.flash = 0;
      const tick = () => {
        this.flash += 0.1;
        this.say(`Загрузка скетча: ${Math.min(100, Math.round(this.flash * 100))}%`, 'good');
        if (this.flash < 1) setTimeout(tick, 220);
        else { this.say('Прошивка готова! Дисплей показывает 0 км/ч.', 'good'); this.done = true; this.refresh(); }
      };
      setTimeout(tick, 300);
    } else {
      this.say('Работает! 🎉', 'good');
      this.done = true;
      this.refresh();
    }
  }

  install() {
    for (const k in this.p.parts) S.inv[k] = Math.max(0, (S.inv[k] || 0) - this.p.parts[k]);
    S.mods[this.p.id] = true;
    S.modOn[this.p.id] = true;
    S.stats.solders++;
    App.ach('first_solder');
    if (PROJECTS.every(p => S.mods[p.id])) App.ach('all_electro');
    Save.save();
    UI.toast(`${this.p.icon} ${this.p.name} установлено на снегокат!`, 'good');
    MG.close(false);
  }

  // ---------- отрисовка
  draw(ctx) {
    const W = 800, H = 450;
    // стол
    ctx.fillStyle = '#5d4037'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    for (let i = 0; i < 18; i++) ctx.fillRect(0, i * 26 + (i % 3) * 3, W, 2);
    // термоковрик
    ctx.fillStyle = '#26695c'; roundRect(ctx, 20, 20, W - 40, H - 40, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
    for (let x = 40; x < W - 20; x += 20) { ctx.beginPath(); ctx.moveTo(x, 20); ctx.lineTo(x, H - 20); ctx.stroke(); }
    for (let y = 40; y < H - 20; y += 20) { ctx.beginPath(); ctx.moveTo(20, y); ctx.lineTo(W - 20, y); ctx.stroke(); }

    for (const c of this.comps) this.drawComp(ctx, c);

    // провода
    for (const w of this.wires) {
      const [ax, ay, mx, my, bx, by] = this.wirePath(w);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(ax, ay + 3); ctx.quadraticCurveTo(mx, my + 3, bx, by + 3); ctx.stroke();
      ctx.strokeStyle = w.color; ctx.lineWidth = 4.5;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(mx, my, bx, by); ctx.stroke();
    }
    // тянущийся провод
    const from = this.pending || this.dragStart;
    if (this.tool === 'wire' && from) {
      const [ax, ay] = this.pinPos(from);
      ctx.setLineDash([8, 6]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(this.mouse.x, this.mouse.y); ctx.stroke(); ctx.setLineDash([]);
    }
    // выводы и точки пайки
    const hover = this.pinAt(this.mouse.x, this.mouse.y);
    for (const p of this.allPins()) {
      const j = this.joints[p.key];
      ctx.fillStyle = '#b87333';
      ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = '#3e2723'; ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, TAU); ctx.fill();
      if (j) {
        if (j.state === 'good') {
          const g = ctx.createRadialGradient(p.x - 2, p.y - 2, 1, p.x, p.y, 8);
          g.addColorStop(0, '#ffffff'); g.addColorStop(0.4, '#cfd8dc'); g.addColorStop(1, '#78909c');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, TAU); ctx.fill();
        } else if (j.state === 'cold') {
          ctx.fillStyle = '#757575'; ctx.beginPath(); ctx.arc(p.x + 1, p.y, 7, 0, TAU); ctx.arc(p.x - 3, p.y - 2, 5, 0, TAU); ctx.fill();
        } else if (j.state === 'burnt') {
          ctx.fillStyle = '#212121'; ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, TAU); ctx.fill();
        } else {
          ctx.strokeStyle = '#ffcc80'; ctx.lineWidth = 2; ctx.setLineDash([3, 3]);
          ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
        }
      }
      const lab = (PIN_LABEL[p.c.t] && PIN_LABEL[p.c.t][p.pin]) || p.pin;
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      const ly = p.y + (p.y >= p.c.y ? 20 : -13);
      ctx.fillText(lab, p.x, ly);
    }
    if (this.marks && this.marks.t > 0) {
      this.marks.t -= 1 / 60;
      for (const k of this.marks.keys) {
        const [x, y] = this.pinPos(k);
        ctx.strokeStyle = `rgba(255,23,68,${0.5 + 0.5 * Math.sin(this.t * 12)})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(x, y, 15, 0, TAU); ctx.stroke();
      }
    }
    if (hover && !this.heating) {
      ctx.strokeStyle = '#fff59d'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(hover.x, hover.y, 13, 0, TAU); ctx.stroke();
      const txt = this.pinName(hover.key);
      ctx.font = '13px sans-serif';
      const tw = ctx.measureText(txt).width + 14;
      const tx = clamp(hover.x - tw / 2, 4, W - tw - 4), ty = hover.y - 42 < 4 ? hover.y + 24 : hover.y - 42;
      ctx.fillStyle = 'rgba(0,0,0,0.8)'; roundRect(ctx, tx, ty, tw, 22, 6); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText(txt, tx + 7, ty + 15);
    }

    // эффекты
    for (const f of this.fx) {
      if (f.type === 'spark') { ctx.fillStyle = `rgba(255,${150 + Math.random() * 100 | 0},0,${f.life})`; ctx.fillRect(f.x, f.y, 3, 3); }
      else {
        const big = f.type === 'bigsmoke';
        ctx.fillStyle = big ? `rgba(40,40,40,${f.life * 0.3})` : `rgba(230,230,230,${f.life * 0.35})`;
        ctx.beginPath(); ctx.arc(f.x, f.y, (big ? 18 : 6) + (1 - f.life) * 10, 0, TAU); ctx.fill();
      }
    }

    // паяльник и шкала нагрева
    if (this.tool === 'iron') {
      const { x, y } = this.mouse;
      ctx.save(); ctx.translate(x, y); ctx.rotate(-0.6);
      ctx.fillStyle = this.heating ? '#ff7043' : '#b0bec5'; ctx.fillRect(-2, -38, 4, 38);
      ctx.fillStyle = '#263238'; roundRect(ctx, -7, -110, 14, 74, 5); ctx.fill();
      ctx.fillStyle = '#ffca28'; ctx.fillRect(-7, -60, 14, 4);
      ctx.restore();
    }
    if (this.heating) {
      const j = this.joints[this.heating];
      const [px, py] = this.pinPos(this.heating);
      const bx = clamp(px - 60, 10, W - 130), by = py - 60 < 10 ? py + 30 : py - 60;
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; roundRect(ctx, bx - 4, by - 4, 128, 22, 6); ctx.fill();
      ctx.fillStyle = '#455a64'; ctx.fillRect(bx, by, 120, 14);
      ctx.fillStyle = '#00c853'; ctx.fillRect(bx + j.zone[0] * 120, by, (j.zone[1] - j.zone[0]) * 120, 14);
      ctx.fillStyle = '#d50000'; ctx.fillRect(bx + j.zone[1] * 120, by, (1 - j.zone[1]) * 120, 14);
      ctx.fillStyle = '#fff'; ctx.fillRect(bx + clamp(j.heat, 0, 1) * 120 - 2, by - 3, 4, 20);
    }
    // проверка удачи — свечение
    if (this.lit) {
      for (const c of this.comps) {
        let col = null;
        if (c.t === 'led') col = c.color;
        if (c.t === 'strip') col = `hsl(${(this.t * 120) % 360},100%,60%)`;
        if (c.t === 'oled') col = '#29b6f6';
        if (!col) continue;
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(c.x, c.y, 2, c.x, c.y, c.t === 'strip' ? 140 : 60);
        g.addColorStop(0, col.startsWith('#') ? hexA(col, 0.9) : col); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, c.t === 'strip' ? 140 : 60, 0, TAU); ctx.fill();
        ctx.restore();
      }
    }
  }

  drawComp(ctx, c) {
    const { x, y } = c, T = c.T;
    ctx.save();
    ctx.translate(x, y);
    // ножки к выводам
    ctx.strokeStyle = '#b0bec5'; ctx.lineWidth = 2.5;
    for (const pin in T.pins) {
      const [px, py] = T.pins[pin];
      ctx.beginPath(); ctx.moveTo(clamp(px, -T.w / 2 + 4, T.w / 2 - 4), clamp(py, -T.h / 2 + 4, T.h / 2 - 4)); ctx.lineTo(px, py); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; roundRect(ctx, -T.w / 2 + 4, -T.h / 2 + 5, T.w, T.h, 8); ctx.fill();
    const lit = this.lit;
    switch (c.t) {
      case 'battery': {
        const g = ctx.createLinearGradient(0, -23, 0, 23);
        g.addColorStop(0, '#42a5f5'); g.addColorStop(0.5, '#1565c0'); g.addColorStop(1, '#0d47a1');
        ctx.fillStyle = g; roundRect(ctx, -65, -23, 130, 46, 10); ctx.fill();
        ctx.fillStyle = '#cfd8dc'; ctx.fillRect(62, -8, 6, 16);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('18650  3.7V', 0, 5);
        ctx.font = 'bold 18px sans-serif'; ctx.fillText('+', 50, 7); ctx.fillText('−', -50, 7);
        break;
      }
      case 'switch':
        ctx.fillStyle = '#263238'; roundRect(ctx, -32, -22, 64, 44, 6); ctx.fill();
        ctx.fillStyle = '#b0bec5'; ctx.beginPath(); ctx.arc(0, -4, 9, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#eceff1'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(lit ? 12 : -12, -26); ctx.stroke();
        break;
      case 'tact':
        ctx.fillStyle = '#212121'; roundRect(ctx, -22, -22, 44, 44, 4); ctx.fill();
        ctx.fillStyle = '#9e9e9e'; ctx.fillRect(-22, -22, 4, 4); ctx.fillRect(18, -22, 4, 4); ctx.fillRect(-22, 18, 4, 4); ctx.fillRect(18, 18, 4, 4);
        ctx.fillStyle = '#424242'; ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();
        break;
      case 'led': {
        ctx.strokeStyle = '#b0bec5'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(-11, 10); ctx.lineTo(-11, 42); ctx.moveTo(11, 10); ctx.lineTo(11, 38); ctx.stroke();
        ctx.fillStyle = c.burnt ? '#212121' : hexA(c.color === '#ffffff' ? '#e0f7fa' : c.color, lit ? 1 : 0.55);
        ctx.beginPath(); ctx.arc(0, -4, 15, Math.PI, 0); ctx.lineTo(15, 12); ctx.lineTo(-15, 12); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(-8, -10, 4, 12);
        break;
      }
      case 'res':
        ctx.fillStyle = '#d7b98e'; roundRect(ctx, -30, -9, 60, 18, 8); ctx.fill();
        ['#795548', '#212121', '#795548', '#ffd600'].forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect(-18 + i * 10, -9, 5, 18); });
        break;
      case 'strip':
        ctx.fillStyle = '#eceff1'; roundRect(ctx, -110, -15, 220, 30, 4); ctx.fill();
        for (let i = 0; i < 9; i++) {
          ctx.fillStyle = lit ? `hsl(${(i * 40 + this.t * 200) % 360},100%,60%)` : '#ffe082';
          ctx.fillRect(-96 + i * 23, -7, 12, 14);
        }
        break;
      case 'buzzer':
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, 0, 25, 0, TAU); ctx.fill();
        ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('+', -13, 20);
        break;
      case 'tilt':
        ctx.fillStyle = '#90a4ae'; roundRect(ctx, -27, -12, 54, 24, 10); ctx.fill();
        ctx.fillStyle = '#eceff1'; ctx.beginPath(); ctx.arc(-8 + Math.sin(this.t * 3) * 6, 0, 6, 0, TAU); ctx.fill();
        break;
      case 'micro':
        ctx.fillStyle = '#212121'; roundRect(ctx, -26, -16, 52, 32, 4); ctx.fill();
        ctx.strokeStyle = '#cfd8dc'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-20, -18); ctx.lineTo(22, -26); ctx.stroke();
        break;
      case 'mcu':
        ctx.fillStyle = '#0d47a1'; roundRect(ctx, -110, -35, 220, 70, 6); ctx.fill();
        ctx.fillStyle = '#212121'; ctx.fillRect(-30, -18, 50, 30);
        ctx.fillStyle = '#cfd8dc'; ctx.fillRect(-108, -12, 22, 22);
        ctx.fillStyle = lit ? '#76ff03' : '#33691e'; ctx.fillRect(70, -25, 8, 6);
        ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textAlign = 'center'; ctx.fillText('NANO', 50, 10);
        break;
      case 'oled':
        ctx.fillStyle = '#1a237e'; roundRect(ctx, -65, -35, 130, 70, 4); ctx.fill();
        ctx.fillStyle = '#000'; ctx.fillRect(-55, -28, 110, 50);
        if (lit) { ctx.fillStyle = '#29b6f6'; ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center'; ctx.fillText(this.done ? '0 км/ч' : '...', 0, 4); }
        break;
      case 'hall':
        ctx.fillStyle = '#004d40'; roundRect(ctx, -35, -14, 70, 28, 3); ctx.fill();
        ctx.fillStyle = '#111'; ctx.fillRect(-8, -8, 16, 12);
        ctx.fillStyle = '#e53935'; ctx.fillRect(22, -10, 8, 8);
        break;
      case 'bt':
        ctx.fillStyle = '#01579b'; roundRect(ctx, -50, -25, 100, 50, 4); ctx.fill();
        ctx.fillStyle = '#cfd8dc'; ctx.fillRect(-40, -15, 40, 22);
        ctx.fillStyle = lit ? '#2979ff' : '#1a237e'; ctx.beginPath(); ctx.arc(30, -10, 4, 0, TAU); ctx.fill();
        break;
      case 'amp':
        ctx.fillStyle = '#b71c1c'; roundRect(ctx, -60, -28, 120, 56, 4); ctx.fill();
        ctx.fillStyle = '#212121'; ctx.fillRect(-14, -10, 28, 20);
        break;
      case 'spk':
        ctx.fillStyle = '#37474f'; ctx.beginPath(); ctx.arc(0, 0, 37, 0, TAU); ctx.fill();
        ctx.fillStyle = '#263238'; ctx.beginPath(); ctx.arc(0, 0, 26 + (lit ? Math.sin(this.t * 30) * 2 : 0), 0, TAU); ctx.fill();
        ctx.fillStyle = '#90a4ae'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
        break;
    }
    if (c.burnt) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; roundRect(ctx, -T.w / 2, -T.h / 2, T.w, T.h, 8); ctx.fill();
    }
    // подпись
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    const pinsBelow = Object.values(T.pins).some(p => p[1] > T.h / 2);
    ctx.fillText(c.label || T.name, 0, pinsBelow ? -T.h / 2 - 8 : T.h / 2 + 18);
    ctx.restore();
  }

  exit(byUser) {
    if (byUser && !this.done && this.wires.length) UI.toast('Схему бросил. Провода и припой не вернуть 🙃');
  }
}

const Solder = {
  canStart(p) {
    for (const k in p.parts) if ((S.inv[k] || 0) < p.parts[k]) return false;
    return true;
  },
  start(p) {
    if (!this.canStart(p)) { UI.toast('Не хватает деталей!', 'bad'); return; }
    MG.open(`Пайка: ${p.name}`, new SolderGame(p));
  },
};

</script>
<script>
'use strict';
// ===== Сборка мотора из бензопилы: этапы-мини-игры =====

function drawSaw(ctx, x, y, s = 1, open = false) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  // шина
  ctx.fillStyle = '#9e9e9e'; roundRect(ctx, 110, -20, 200, 40, 20); ctx.fill();
  ctx.strokeStyle = '#616161'; ctx.lineWidth = 4; roundRect(ctx, 110, -20, 200, 40, 20); ctx.stroke();
  // корпус
  ctx.fillStyle = open ? '#455a64' : '#ef6c00';
  roundRect(ctx, -150, -90, 270, 170, 30); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.15)'; roundRect(ctx, -150, 30, 270, 50, 20); ctx.fill();
  // ручка
  ctx.strokeStyle = '#212121'; ctx.lineWidth = 18;
  ctx.beginPath(); ctx.moveTo(-150, -40); ctx.quadraticCurveTo(-230, -40, -230, 20); ctx.lineTo(-150, 40); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-60, -90); ctx.quadraticCurveTo(-20, -150, 60, -90); ctx.stroke();
  ctx.restore();
}

// ---------- 1. Разборка: болты
class BoltsGame {
  start(api) {
    this.api = api; this.t = 0; this.tool = 'key'; this.hold = null;
    const pos = [[250, 140], [400, 120], [520, 150], [240, 300], [380, 320], [520, 300], [310, 220], [460, 220]];
    const rusty = new Set(); while (rusty.size < 3) rusty.add(randi(0, 7));
    this.bolts = pos.map((p, i) => ({ x: p[0], y: p[1], rusty: rusty.has(i), soak: 0, soaking: false, prog: 0, stripped: false, removed: false, rot: rand(0, 6) }));
    this.drops = [];
    this.msg = 'Зажми болт ключом, чтобы открутить. Рыжие — закисли!';
    this.ui();
  }
  ui() {
    const left = this.bolts.filter(b => !b.removed).length;
    this.api.info(`<div class="mg-sec"><b>🔧 Разборка</b><div class="small">Осталось болтов: <b>${left}</b></div></div>
      <div class="mg-sec small">Ржавый болт сначала <b>побрызгай смазкой</b> и подожди, пока впитается. Иначе сорвёшь грани — и придётся долго высверливать.</div>
      <div class="mg-log"><div>${this.msg}</div></div>`);
    this.api.buttons([
      { label: '🔧 Ключ', active: this.tool === 'key', onClick: () => { this.tool = 'key'; this.ui(); } },
      { label: '🧴 Смазка', active: this.tool === 'wd', onClick: () => { this.tool = 'wd'; this.ui(); } },
    ]);
  }
  boltAt(x, y) { return this.bolts.find(b => !b.removed && dist(x, y, b.x, b.y) < 28); }
  down(x, y) {
    const b = this.boltAt(x, y); if (!b) return;
    if (this.tool === 'wd') {
      if (!b.rusty || b.soak >= 1) { this.msg = 'Этот болт и так нормальный.'; this.ui(); return; }
      b.soaking = true; Sfx.noise(0.5, 0.2, 3000, 'highpass');
      for (let i = 0; i < 10; i++) this.drops.push({ x: b.x + rand(-15, 15), y: b.y - 20, vy: rand(20, 60), life: 1 });
      this.msg = 'Пшшш… Ждём, пока впитается.'; this.ui();
    } else this.hold = b;
  }
  up() { this.hold = null; }
  update(dt) {
    this.t += dt;
    for (const b of this.bolts) if (b.soaking && b.soak < 1) { b.soak = Math.min(1, b.soak + dt / 2.5); if (b.soak >= 1) { this.msg = 'Смазка впиталась — можно крутить.'; this.ui(); } }
    const b = this.hold;
    if (b && !b.removed) {
      const speed = b.stripped ? 1 / 5 : 1 / 1.1;
      b.prog += dt * speed;
      b.rot += dt * (b.stripped ? 20 : 4);
      if (Math.random() < dt * 8) b.stripped ? Sfx.noise(0.08, 0.15, 2500, 'bandpass') : Sfx.ratchet();
      if (b.rusty && b.soak < 1 && !b.stripped && b.prog > 0.35) {
        b.stripped = true; b.prog = 0; this.hold = null;
        Sfx.error(); this.msg = '😱 Сорвал грани! Теперь только высверливать (зажми и жди).'; this.ui();
      }
      if (b.prog >= 1) {
        b.removed = true; this.hold = null; Sfx.tone(600, 0.1, 'triangle', 0.15); Sfx.tone(400, 0.15, 'triangle', 0.1, 0, 0.12);
        this.msg = b.stripped ? 'Высверлил. Фух.' : 'Болт откручен!';
        this.ui();
        if (this.bolts.every(b => b.removed)) Motor.complete('Крышка снята! Внутри… опилки и мышиное гнездо.');
      }
    }
    for (const d of this.drops) { d.y += d.vy * dt; d.life -= dt; }
    this.drops = this.drops.filter(d => d.life > 0);
  }
  draw(ctx) {
    ctx.fillStyle = '#3e2723'; ctx.fillRect(0, 0, 800, 450);
    drawSaw(ctx, 380, 230, 1);
    for (const b of this.bolts) {
      if (b.removed) { ctx.fillStyle = '#212121'; ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, TAU); ctx.fill(); continue; }
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.fillStyle = b.rusty && b.soak < 1 ? (b.soak > 0 ? '#a1887f' : '#8d4a1f') : '#b0bec5';
      ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i * TAU / 6; ctx.lineTo(Math.cos(a) * 18, Math.sin(a) * 18); } ctx.closePath(); ctx.fill();
      ctx.fillStyle = b.stripped ? '#5d4037' : '#78909c'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill();
      if (b.stripped) { ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU); ctx.stroke(); }
      ctx.restore();
      if (b.prog > 0) {
        ctx.strokeStyle = b.stripped ? '#ff7043' : '#69f0ae'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(b.x, b.y, 25, -Math.PI / 2, -Math.PI / 2 + TAU * b.prog); ctx.stroke();
      }
      if (b.soaking && b.soak < 1) {
        ctx.strokeStyle = '#4fc3f7'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(b.x, b.y, 30, -Math.PI / 2, -Math.PI / 2 + TAU * b.soak); ctx.stroke();
      }
    }
    ctx.fillStyle = '#4fc3f7'; for (const d of this.drops) ctx.fillRect(d.x, d.y, 3, 6);
  }
}

// ---------- 2. Чистка карбюратора
class CleanGame {
  start(api) {
    this.api = api; this.t = 0; this.held = false; this.mx = 0; this.my = 0;
    this.gw = 40; this.gh = 22; this.grid = [];
    for (let i = 0; i < this.gw * this.gh; i++) this.grid.push(rand(0.6, 1));
    this.jet = { x: 400, y: 225, clicks: 0, timer: 0, done: false };
    this.api.buttons([]);
    this.ui();
  }
  clean() { let s = 0; for (const v of this.grid) s += v; return 1 - s / this.grid.length; }
  ui() {
    const c = Math.round(this.clean() * 100);
    this.api.info(`<div class="mg-sec"><b>🧽 Чистка карбюратора</b></div>
      <div class="mg-sec">Чистота: <b>${c}%</b> (нужно 95%)<div class="bar"><i style="width:${c}%"></i></div></div>
      <div class="mg-sec small">Води пальцем/мышкой с зажатой кнопкой — оттираешь нагар очистителем.</div>
      <div class="mg-sec small">${this.clean() > 0.6 ? (this.jet.done ? '✅ Жиклёр продут!' : '👉 Появился жиклёр в центре! <b>Быстро тыкни по нему 5 раз</b>, чтобы продуть.') : 'Где-то под грязью есть жиклёр…'}</div>`);
  }
  down(x, y) {
    this.held = true; this.mx = x; this.my = y;
    if (this.clean() > 0.6 && !this.jet.done && dist(x, y, this.jet.x, this.jet.y) < 30) {
      this.jet.clicks++; this.jet.timer = 1.5; Sfx.noise(0.15, 0.3, 2000, 'bandpass');
      if (this.jet.clicks >= 5) { this.jet.done = true; Sfx.success(); this.ui(); this.check(); }
    }
  }
  move(x, y) { this.mx = x; this.my = y; }
  up() { this.held = false; }
  check() { if (this.clean() >= 0.95 && this.jet.done) Motor.complete('Карбюратор блестит как новый!'); }
  update(dt) {
    this.t += dt;
    if (this.jet.timer > 0) { this.jet.timer -= dt; if (this.jet.timer <= 0 && !this.jet.done) this.jet.clicks = 0; }
    if (this.held) {
      const cw = 560 / this.gw, ch = 300 / this.gh;
      let changed = false;
      for (let gy = 0; gy < this.gh; gy++) for (let gx = 0; gx < this.gw; gx++) {
        const cx = 120 + gx * cw + cw / 2, cy = 75 + gy * ch + ch / 2;
        const d = dist(cx, cy, this.mx, this.my);
        if (d < 34) { const i = gy * this.gw + gx; if (this.grid[i] > 0) { this.grid[i] = Math.max(0, this.grid[i] - dt * 2.2 * (1 - d / 40)); changed = true; } }
      }
      if (changed && Math.random() < dt * 10) Sfx.noise(0.05, 0.05, 5000, 'highpass');
      if (changed && Math.floor(this.t * 6) !== Math.floor((this.t - dt) * 6)) { this.ui(); this.check(); }
    }
  }
  draw(ctx) {
    ctx.fillStyle = '#263238'; ctx.fillRect(0, 0, 800, 450);
    // карбюратор
    ctx.fillStyle = '#cfd8dc'; roundRect(ctx, 120, 75, 560, 300, 40); ctx.fill();
    ctx.fillStyle = '#b0bec5'; ctx.beginPath(); ctx.arc(400, 225, 90, 0, TAU); ctx.fill();
    ctx.fillStyle = '#90a4ae'; ctx.beginPath(); ctx.arc(400, 225, 55, 0, TAU); ctx.fill();
