    ctx.fillStyle = '#eceff1'; [[200, 130], [600, 130], [200, 320], [600, 320]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 14, 0, TAU); ctx.fill(); });
    if (this.clean() > 0.6) {
      ctx.fillStyle = this.jet.done ? '#212121' : '#4e342e';
      ctx.beginPath(); ctx.arc(this.jet.x, this.jet.y, 12, 0, TAU); ctx.fill();
      if (!this.jet.done) { ctx.strokeStyle = `rgba(255,235,59,${0.5 + 0.5 * Math.sin(this.t * 8)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(this.jet.x, this.jet.y, 24, 0, TAU); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`${this.jet.clicks}/5`, this.jet.x, this.jet.y - 32); }
    }
    // грязь
    const cw = 560 / this.gw, ch = 300 / this.gh;
    for (let gy = 0; gy < this.gh; gy++) for (let gx = 0; gx < this.gw; gx++) {
      const v = this.grid[gy * this.gw + gx];
      if (v <= 0.02) continue;
      ctx.fillStyle = `rgba(${50 + gx % 3 * 8},${35 + gy % 2 * 6},20,${v * 0.95})`;
      ctx.fillRect(120 + gx * cw, 75 + gy * ch, cw + 0.5, ch + 0.5);
    }
    if (this.held) { ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.arc(this.mx, this.my, 34, 0, TAU); ctx.fill(); }
  }
}

// ---------- 3. Замена деталей + зазор свечи
class PartsGame {
  start(api) {
    this.api = api; this.t = 0; this.drag = null; this.phase = 'place'; this.gap = 0.8;
    this.slots = [
      { id: 'plug', x: 250, y: 110, label: 'свеча', shape: 'plug' },
      { id: 'hose', x: 240, y: 300, label: 'шланг', shape: 'hose' },
      { id: 'mem', x: 420, y: 230, label: 'мембрана', shape: 'mem' },
    ];
    const tray = [['plug', 'plug'], ['hose', 'hose'], ['mem', 'mem'], ['bolt', 'bolt'], ['spring', 'spring'], ['washer', 'washer']];
    tray.sort(() => Math.random() - 0.5);
    this.parts = tray.map(([id, shape], i) => ({ id, shape, hx: 640 + (i % 2) * 90, hy: 80 + Math.floor(i / 2) * 110, x: 0, y: 0, placed: false }));
    this.parts.forEach(p => { p.x = p.hx; p.y = p.hy; });
    this.msg = 'Перетащи новые детали на свои места. Лишние детали… останутся лишними.';
    this.ui();
  }
  ui() {
    if (this.phase === 'gap') {
      this.api.info(`<div class="mg-sec"><b>⚡ Зазор свечи</b></div><div class="mg-sec">Зазор: <b style="font-size:22px">${this.gap.toFixed(2)} мм</b></div>
        <div class="mg-sec small">В инструкции к пиле: <i>«зазор свечи 0.5 мм»</i>. Подгибай электрод.</div>`);
      this.api.buttons([
        { label: '− 0.05', onClick: () => { this.gap = Math.max(0.2, this.gap - 0.05); Sfx.ratchet(); this.ui(); } },
        { label: '+ 0.05', onClick: () => { this.gap = Math.min(1.2, this.gap + 0.05); Sfx.ratchet(); this.ui(); } },
        { label: '✅ Вкрутить свечу', cls: 'primary', onClick: () => {
          if (Math.abs(this.gap - 0.5) < 0.026) Motor.complete('Свеча, шланг и мембраны на месте!');
          else { Sfx.error(); this.msg = this.gap > 0.5 ? 'Искра слабая — слишком большой зазор.' : 'Искры почти нет — зазор маленький.'; UI.toast(this.msg, 'bad'); }
        } },
      ]);
      return;
    }
    this.api.info(`<div class="mg-sec"><b>🧩 Замена деталей</b></div><div class="mg-log"><div>${this.msg}</div></div>`);
    this.api.buttons([]);
  }
  down(x, y) {
    if (this.phase !== 'place') return;
    this.drag = this.parts.find(p => !p.placed && dist(x, y, p.x, p.y) < 40) || null;
    if (this.drag) { this.ox = this.drag.x - x; this.oy = this.drag.y - y; }
  }
  move(x, y) { if (this.drag) { this.drag.x = x + this.ox; this.drag.y = y + this.oy; } }
  up() {
    const p = this.drag; this.drag = null; if (!p) return;
    const slot = this.slots.find(s => dist(p.x, p.y, s.x, s.y) < 55);
    if (slot && slot.id === p.id) {
      p.placed = true; p.x = slot.x; p.y = slot.y; Sfx.tone(500, 0.08, 'triangle', 0.15);
      this.msg = 'Встало как родное!';
      if (this.slots.every(s => this.parts.find(q => q.id === s.id).placed)) { this.phase = 'gap'; Sfx.success(); }
    } else {
      if (slot) { Sfx.error(); this.msg = 'Не подходит!'; }
      else if (['bolt', 'spring', 'washer'].includes(p.id) && p.x < 600) { this.msg = 'Это лишняя деталь… Откуда она вообще?'; }
      p.x = p.hx; p.y = p.hy;
    }
    this.ui();
  }
  shape(ctx, s, x, y, ghost) {
    ctx.save(); ctx.translate(x, y);
    ctx.globalAlpha = ghost ? 0.3 : 1;
    ctx.fillStyle = ghost ? '#000' : null;
    if (s === 'plug') {
      if (!ghost) ctx.fillStyle = '#eceff1'; ctx.fillRect(-10, -35, 20, 40);
      if (!ghost) ctx.fillStyle = '#90a4ae'; ctx.fillRect(-14, 0, 28, 14); ctx.fillRect(-6, 14, 12, 18);
    } else if (s === 'hose') {
      ctx.strokeStyle = ghost ? '#000' : '#ffb300'; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(-35, -10); ctx.bezierCurveTo(-10, 30, 10, -30, 35, 10); ctx.stroke();
    } else if (s === 'mem') {
      if (!ghost) ctx.fillStyle = '#212121'; ctx.beginPath(); ctx.ellipse(0, 0, 32, 22, 0, 0, TAU); ctx.fill();
      if (!ghost) { ctx.fillStyle = '#424242'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill(); }
    } else if (s === 'bolt') {
      ctx.fillStyle = '#9e9e9e'; ctx.fillRect(-5, -20, 10, 40); ctx.fillRect(-12, -26, 24, 8);
    } else if (s === 'spring') {
      ctx.strokeStyle = '#bdbdbd'; ctx.lineWidth = 3; ctx.beginPath();
      for (let i = 0; i <= 40; i++) ctx.lineTo(Math.sin(i * 1.2) * 10, -20 + i);
      ctx.stroke();
    } else if (s === 'washer') {
      ctx.strokeStyle = '#bdbdbd'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }
  update(dt) { this.t += dt; }
  draw(ctx) {
    ctx.fillStyle = '#37474f'; ctx.fillRect(0, 0, 800, 450);
    drawSaw(ctx, 300, 240, 0.95, true);
    ctx.fillStyle = '#263238'; roundRect(ctx, 600, 30, 190, 390, 14); ctx.fill();
    ctx.fillStyle = '#90a4ae'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Коробка с деталями', 695, 52);
    for (const s of this.slots) {
      const p = this.parts.find(q => q.id === s.id);
      if (!p.placed) {
        this.shape(ctx, s.shape, s.x, s.y, true);
        ctx.strokeStyle = `rgba(255,235,59,${0.4 + 0.3 * Math.sin(this.t * 4)})`; ctx.setLineDash([6, 5]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(s.x, s.y, 48, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    for (const p of this.parts) if (p !== this.drag) this.shape(ctx, p.shape, p.x, p.y, false);
    if (this.drag) this.shape(ctx, this.drag.shape, this.drag.x, this.drag.y, false);
    if (this.phase === 'gap') {
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, 800, 450);
      ctx.save(); ctx.translate(400, 230);
      ctx.fillStyle = '#eceff1'; ctx.fillRect(-30, -200, 60, 120);
      ctx.fillStyle = '#90a4ae'; ctx.fillRect(-40, -80, 80, 70);
      ctx.fillStyle = '#bdbdbd'; ctx.fillRect(-8, -10, 16, 50);
      const g = this.gap * 120;
      ctx.fillStyle = '#9e9e9e'; ctx.fillRect(-40, 40 + g, 60, 14); ctx.fillRect(-40, -10, 14, 64 + g);
      if (Math.abs(this.gap - 0.5) < 0.026 && Math.sin(this.t * 20) > 0) { ctx.strokeStyle = '#80d8ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 40); ctx.lineTo(4, 40 + g / 2); ctx.lineTo(-3, 40 + g); ctx.stroke(); }
      ctx.restore();
    }
  }
}

// ---------- 4. Токарный станок: тайминг
class LatheGame {
  start(api) {
    this.api = api; this.t = 0; this.pos = 0; this.dir = 1; this.speed = 0.7;
    this.zone = 0.22; this.zc = rand(0.3, 0.7); this.hits = 0; this.miss = 0; this.need = 6; this.flash = 0; this.sparks = []; this.over = false;
    this.ui();
  }
  ui() {
    this.api.info(`<div class="mg-sec"><b>⚙️ Вал и звёздочка</b></div>
      <div class="mg-sec">Проходов: <b>${this.hits}/${this.need}</b><br>Промахи: <b style="color:${this.miss ? '#ff5252' : '#fff'}">${this.miss}/3</b></div>
      <div class="mg-sec small">Жми <b>«Резец!»</b> (или пробел), когда бегунок в зелёной зоне. Каждый проход точнее и быстрее. 3 промаха — заготовка в брак!</div>`);
    this.api.buttons([{ label: '🔪 Резец!', cls: 'primary', onClick: () => this.cut() }]);
  }
  key(code) { if (code === 'Space' || code === 'Enter') this.cut(); }
  down(x, y) { if (y > 330) this.cut(); }
  cut() {
    if (this.over) return;
    if (Math.abs(this.pos - this.zc) <= this.zone / 2) {
      this.hits++; this.flash = 0.3; Sfx.noise(0.25, 0.3, 3000, 'bandpass');
      for (let i = 0; i < 25; i++) this.sparks.push({ x: 400, y: 190, vx: rand(-200, 200), vy: rand(-250, -50), life: rand(0.3, 0.8) });
      this.zone *= 0.84; this.speed *= 1.15; this.zc = rand(0.15, 0.85);
      if (this.hits >= this.need) { this.over = true; setTimeout(() => Motor.complete('Звёздочка выточена и насажена на вал!'), 600); }
    } else {
      this.miss++; Sfx.error(); this.flash = -0.3;
      if (this.miss >= 3) {
        this.over = true;
        S.inv.sprocket = Math.max(0, (S.inv.sprocket || 0) - 1); Save.save();
        setTimeout(() => { UI.modal('Брак! 💢', 'Резец сорвался и запорол заготовку.<br>Звёздочку придётся купить заново.'); MG.close(false); }, 500);
      }
    }
    this.ui();
  }
  update(dt) {
    this.t += dt;
    if (!this.over) {
      this.pos += this.dir * this.speed * dt;
      if (this.pos > 1) { this.pos = 1; this.dir = -1; } if (this.pos < 0) { this.pos = 0; this.dir = 1; }
    }
    this.flash = this.flash > 0 ? Math.max(0, this.flash - dt) : Math.min(0, this.flash + dt);
    for (const s of this.sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 600 * dt; s.life -= dt; }
    this.sparks = this.sparks.filter(s => s.life > 0);
  }
  draw(ctx) {
    ctx.fillStyle = this.flash < 0 ? '#4a1414' : '#263238'; ctx.fillRect(0, 0, 800, 450);
    // станок
    ctx.fillStyle = '#546e7a'; ctx.fillRect(60, 250, 680, 40);
    ctx.fillStyle = '#37474f'; ctx.fillRect(80, 120, 120, 140);
    ctx.fillStyle = '#78909c'; ctx.fillRect(200, 175, 400, 30);
    // заготовка-звёздочка
    ctx.save(); ctx.translate(400, 190); ctx.rotate(this.t * 25);
    const teeth = Math.min(this.hits * 3, 18);
    ctx.fillStyle = '#b0bec5'; ctx.beginPath();
    for (let i = 0; i < 36; i++) { const a = i * TAU / 36; const r = i % 2 && i / 2 < teeth ? 52 : 62; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#455a64'; ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fill();
    ctx.restore();
    // резец
    ctx.fillStyle = '#ffca28'; ctx.beginPath(); ctx.moveTo(470 - (this.flash > 0 ? 8 : 0), 190); ctx.lineTo(540, 175); ctx.lineTo(540, 205); ctx.closePath(); ctx.fill();
    for (const s of this.sparks) { ctx.fillStyle = `rgba(255,200,0,${s.life * 1.5})`; ctx.fillRect(s.x, s.y, 3, 3); }
    // шкала
    const bx = 100, by = 350, bw = 600;
    ctx.fillStyle = '#111'; roundRect(ctx, bx - 6, by - 6, bw + 12, 44, 10); ctx.fill();
    ctx.fillStyle = '#b71c1c'; ctx.fillRect(bx, by, bw, 32);
    ctx.fillStyle = '#00c853'; ctx.fillRect(bx + (this.zc - this.zone / 2) * bw, by, this.zone * bw, 32);
    ctx.fillStyle = '#fff'; ctx.fillRect(bx + this.pos * bw - 3, by - 8, 6, 48);
  }
}

// ---------- 5. Сварка рамы: веди по шву
class WeldGame {
  start(api) {
    this.api = api; this.t = 0; this.held = false; this.mx = 0; this.my = 0;
    this.seams = [
      [[150, 150], [300, 140], [450, 160], [620, 150]],
      [[200, 330], [260, 250], [330, 200], [420, 180]],
      [[480, 330], [520, 260], [600, 230], [660, 260], [680, 330]],
    ];
    this.si = 0; this.prog = 0; this.defects = 0; this.cool = 0; this.sparks = []; this.done = [];
    this.build();
    this.ui();
  }
  build() {
    // разбиваем шов на точки через 4px
    const s = this.seams[this.si], pts = [];
    for (let i = 0; i < s.length - 1; i++) {
      const [ax, ay] = s[i], [bx, by] = s[i + 1];
      const n = Math.ceil(dist(ax, ay, bx, by) / 4);
      for (let k = 0; k < n; k++) pts.push([lerp(ax, bx, k / n), lerp(ay, by, k / n)]);
    }
    pts.push(s[s.length - 1]);
    this.pts = pts; this.prog = 0; this.defects = 0;
  }
  ui() {
    this.api.info(`<div class="mg-sec"><b>🔥 Сварка рамы</b></div>
      <div class="mg-sec">Шов: <b>${this.si + 1}/${this.seams.length}</b><div class="bar"><i style="width:${Math.round(this.prog / (this.pts.length - 1) * 100)}%"></i></div></div>
      <div class="mg-sec">Непровары: <b style="color:${this.defects > 2 ? '#ff5252' : '#fff'}">${this.defects}/5</b></div>
      <div class="mg-sec small">Зажми у начала шва (жёлтая точка) и веди электрод по линии. Сойдёшь с линии — непровар. 5 непроваров — шов переваривать.</div>`);
    this.api.buttons([]);
  }
  down(x, y) { this.held = true; this.mx = x; this.my = y; }
  move(x, y) { this.mx = x; this.my = y; }
  up() { this.held = false; }
  update(dt) {
    this.t += dt; this.cool -= dt;
    if (this.held && this.si < this.seams.length) {
      const [px, py] = this.pts[this.prog];
      const d = dist(this.mx, this.my, px, py);
      if (d < 26) {
        // продвигаемся к ближайшей точке впереди
        let best = this.prog;
        for (let i = this.prog; i < Math.min(this.pts.length, this.prog + 12); i++) if (dist(this.mx, this.my, this.pts[i][0], this.pts[i][1]) < 16) best = i;
        if (best > this.prog) { this.prog = best; if (Math.random() < 0.5) Sfx.noise(0.06, 0.12, 3000, 'highpass'); }
        for (let i = 0; i < 2; i++) this.sparks.push({ x: this.mx, y: this.my, vx: rand(-150, 150), vy: rand(-180, 40), life: rand(0.2, 0.5) });
        if (this.prog >= this.pts.length - 1) {
          this.done.push(this.pts); this.si++; Sfx.success();
          if (this.si >= this.seams.length) { this.held = false; Motor.complete('Рама сварена! Петрович одобрительно кивнул.'); return; }
          this.build(); this.held = false;
        }
      } else if (this.prog > 0 && this.cool <= 0) {
        this.defects++; this.cool = 0.5; Sfx.error();
        if (this.defects >= 5) { UI.toast('Шов кривой — срезаем и варим заново', 'bad'); this.build(); }
      }
      if (Math.floor(this.t * 5) !== Math.floor((this.t - dt) * 5)) this.ui();
    }
    for (const s of this.sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 500 * dt; s.life -= dt; }
    this.sparks = this.sparks.filter(s => s.life > 0);
  }
  draw(ctx) {
    ctx.fillStyle = '#0b0f0d'; ctx.fillRect(0, 0, 800, 450);
    // заготовки (видны тускло — маска сварщика)
    ctx.strokeStyle = '#2e3b33'; ctx.lineWidth = 18;
    for (const s of this.seams) { ctx.beginPath(); s.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.stroke(); }
    // готовые швы
    ctx.strokeStyle = '#8d8d6e'; ctx.lineWidth = 6;
    for (const pts of this.done) { ctx.beginPath(); pts.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.stroke(); }
    if (this.si < this.seams.length) {
      ctx.setLineDash([5, 7]); ctx.strokeStyle = '#4caf50'; ctx.lineWidth = 2;
      ctx.beginPath(); this.pts.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.stroke(); ctx.setLineDash([]);
      // текущий шов: горячий
      ctx.lineWidth = 7;
      for (let i = 1; i <= this.prog; i++) {
        const age = (this.prog - i) / 40;
        ctx.strokeStyle = age < 1 ? `rgb(255,${Math.round(120 + age * 80)},${Math.round(age * 100)})` : '#8d8d6e';
        ctx.beginPath(); ctx.moveTo(this.pts[i - 1][0], this.pts[i - 1][1]); ctx.lineTo(this.pts[i][0], this.pts[i][1]); ctx.stroke();
      }
      const [px, py] = this.pts[this.prog];
      ctx.fillStyle = `rgba(255,235,59,${0.5 + 0.5 * Math.sin(this.t * 10)})`; ctx.beginPath(); ctx.arc(px, py, 7, 0, TAU); ctx.fill();
    }
    if (this.held) {
      const g = ctx.createRadialGradient(this.mx, this.my, 0, this.mx, this.my, 70);
      g.addColorStop(0, 'rgba(220,240,255,0.95)'); g.addColorStop(0.15, 'rgba(120,200,255,0.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(this.mx, this.my, 70, 0, TAU); ctx.fill();
    }
    for (const s of this.sparks) { ctx.fillStyle = `rgba(255,220,120,${s.life * 2})`; ctx.fillRect(s.x, s.y, 2, 2); }
    ctx.fillStyle = '#4caf50'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('Вид через маску сварщика', 12, 20);
  }
}

// ---------- 6. Колесо и цепь
class ChainGame {
  start(api) {
    this.api = api; this.t = 0; this.tension = 20; this.align = randi(4, 7) * (Math.random() < 0.5 ? -1 : 1); this.spin = 0; this.jump = 0;
    this.ui();
  }
  ok() { return this.tension >= 55 && this.tension <= 70 && this.align === 0; }
  ui() {
    const tStr = this.tension < 55 ? 'провисает' : this.tension > 70 ? 'перетянута' : 'в самый раз';
    this.api.info(`<div class="mg-sec"><b>🛞 Колесо и цепь</b></div>
      <div class="mg-sec">Натяжение: <b>${tStr}</b><div class="bar"><i style="width:${this.tension}%"></i></div></div>
      <div class="mg-sec">Соосность: <b>${this.align === 0 ? 'ровно ✓' : (this.align > 0 ? 'колесо смотрит вправо' : 'колесо смотрит влево')}</b></div>
      <div class="mg-sec small">Цепь должна чуть-чуть провисать (пальцем на 1 см). Колесо — строго в линию со звёздочкой. «Крутануть» — проверить.</div>`);
    this.api.buttons([
      { label: '⬅ Натяжитель', onClick: () => { this.tension = Math.max(0, this.tension - 5); Sfx.ratchet(); this.ui(); } },
      { label: 'Натяжитель ➡', onClick: () => { this.tension = Math.min(100, this.tension + 5); Sfx.ratchet(); this.ui(); } },
      { label: '↺ Ось', onClick: () => { this.align--; Sfx.ratchet(); this.ui(); } },
      { label: 'Ось ↻', onClick: () => { this.align++; Sfx.ratchet(); this.ui(); } },
      { label: '🌀 Крутануть', onClick: () => this.test() },
      { label: '🔩 Затянуть гайки', cls: 'primary', onClick: () => {
        if (this.ok()) Motor.complete('Колесо стоит ровно, цепь натянута!');
        else { Sfx.error(); UI.toast(this.tension > 70 ? 'Перетянул — цепь звенит как струна!' : this.tension < 55 ? 'Цепь слетит на первой кочке!' : 'Колесо кривое — цепь будет слетать', 'bad'); }
      } },
    ]);
  }
  test() {
    this.spin = 2;
    if (this.align !== 0 || this.tension < 55) { this.jump = 1.2; Sfx.noise(0.4, 0.3, 800); setTimeout(() => UI.toast('Цепь спрыгнула! 😬', 'bad'), 500); }
    else if (this.tension > 70) { Sfx.tone(200, 0.4, 'sawtooth', 0.08); setTimeout(() => UI.toast('Туго крутится, скрипит', 'bad'), 400); }
    else { Sfx.noise(0.6, 0.15, 1500, 'bandpass'); setTimeout(() => UI.toast('Крутится ровно и тихо 👌', 'good'), 400); }
  }
  update(dt) { this.t += dt; this.spin = Math.max(0, this.spin - dt); this.jump = Math.max(0, this.jump - dt); }
  draw(ctx) {
    ctx.fillStyle = '#37474f'; ctx.fillRect(0, 0, 800, 450);
    ctx.fillStyle = '#263238'; ctx.fillRect(0, 380, 800, 70);
    const sx = 240, sy = 200, wx = 520 + this.tension * 0.6, wy = 280;
    const rot = this.t * (this.spin > 0 ? 12 : 0);
    // звёздочка мотора
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(rot);
    ctx.fillStyle = '#b0bec5'; ctx.beginPath(); for (let i = 0; i < 20; i++) { const a = i * TAU / 20, r = i % 2 ? 26 : 32; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill();
    ctx.restore();
    // колесо (вид сверху-сбоку — наклон показывает соосность)
    ctx.save(); ctx.translate(wx, wy); ctx.rotate(rot);
    ctx.scale(1 - Math.abs(this.align) * 0.05, 1);
    ctx.fillStyle = '#212121'; ctx.beginPath(); ctx.arc(0, 0, 90, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#9e9e9e'; ctx.lineWidth = 3;
    for (let i = 0; i < 16; i++) { const a = i * TAU / 16; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 88, Math.sin(a) * 88); ctx.lineTo(Math.cos(a) * 100, Math.sin(a) * 100); ctx.stroke(); }
    ctx.fillStyle = '#616161'; ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.fill();
    ctx.fillStyle = '#b0bec5'; ctx.beginPath(); for (let i = 0; i < 30; i++) { const a = i * TAU / 30, r = i % 2 ? 30 : 36; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill();
    ctx.restore();
    // цепь
    const sag = Math.max(0, 60 - this.tension) * 1.4 + 6 + (this.jump > 0 ? Math.sin(this.t * 40) * 25 : 0);
    ctx.strokeStyle = '#757575'; ctx.lineWidth = 6; ctx.setLineDash([6, 3]);
    ctx.beginPath(); ctx.moveTo(sx, sy - 30); ctx.lineTo(wx, wy - 36); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx, sy + 30); ctx.quadraticCurveTo((sx + wx) / 2, (sy + wy) / 2 + 36 + sag, wx, wy + 36); ctx.stroke();
    ctx.setLineDash([]);
    // индикатор соосности
    ctx.strokeStyle = this.align === 0 ? '#69f0ae' : '#ff5252'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(wx, 140); ctx.lineTo(wx + this.align * 8, 120); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('соосность', wx, 110);
  }
}

// ---------- 7. Первый запуск: подсос и стартер
class StartGame {
  start(api) {
    this.api = api; this.t = 0; this.choke = false; this.pop = false; this.flooded = false; this.running = false;
    this.handle = { y: 0, drag: false, startY: 0, startT: 0 }; this.dry = 0; this.drying = false; this.pulls = 0; this.smoke = [];
    this.msg = 'Холодный мотор: включи подсос, потом резко дёрни шнур вниз.';
    this.ui();
  }
  ui() {
    this.api.info(`<div class="mg-sec"><b>🔥 Первый запуск</b></div>
      <div class="mg-sec">Подсос: <b>${this.choke ? 'ВКЛ' : 'выкл'}</b> · Рывков: ${this.pulls}</div>
      <div class="mg-sec small">Тяни ручку стартера <b>резко вниз</b>. Как мотор «чихнёт» — выключай подсос. Перестараешься с подсосом — зальёшь свечу.</div>
      <div class="mg-log"><div>${this.msg}</div></div>`);
    const b = [];
    if (this.running) b.push({ label: '✅ Отлично!', cls: 'primary', onClick: () => Motor.complete('ДРРРРРРР! Мотор завёлся! Соседи в восторге (нет).') });
    else {
      b.push({ label: this.choke ? '🟢 Подсос ВКЛ' : '⚪ Подсос выкл', active: this.choke, onClick: () => { this.choke = !this.choke; Sfx.click(); this.ui(); } });
      if (this.flooded) b.push({ label: this.drying ? '⏳ Сушим…' : '🔧 Выкрутить и просушить свечу', disabled: this.drying, onClick: () => { this.drying = true; this.dry = 0; this.ui(); } });
    }
    this.api.buttons(b);
  }
  down(x, y) { if (!this.running && dist(x, y, 200, 180 + this.handle.y) < 50) { this.handle.drag = true; this.handle.startY = y; this.handle.startT = this.t; } }
  move(x, y) { if (this.handle.drag) { this.handle.y = clamp(y - this.handle.startY, 0, 220); if (Math.random() < 0.3) Sfx.ratchet(); } }
  up() {
    if (!this.handle.drag) return;
    this.handle.drag = false;
    const len = this.handle.y, time = this.t - this.handle.startT;
    if (len > 150 && time < 0.6) this.pull(); else if (len > 30) { this.msg = 'Слабо дёрнул! Резче и до конца.'; this.ui(); }
  }
  pull() {
    this.pulls++;
    Sfx.noise(0.3, 0.2, 600);
    // залезть в бак
    S.tank.fuel = Math.max(0, S.tank.fuel - 2);
    if (this.flooded) { this.msg = 'Тишина. Свеча мокрая — залил.'; this.ui(); return; }
    if (this.choke) {
      if (this.pop) {
        if (Math.random() < 0.6) { this.flooded = true; this.pop = false; this.msg = '💧 Залил свечу! Надо было выключить подсос.'; Sfx.error(); }
        else { this.msg = 'Чих-пых… Выключи подсос!'; Sfx.pop(); }
      } else if (Math.random() < 0.35) { this.pop = true; this.msg = '💨 ЧИХ! Схватило! Теперь выключи подсос и дёргай.'; Sfx.pop(); this.puff(); }
      else this.msg = 'Пока не схватывает. Ещё!';
    } else {
      const chance = this.pop ? 0.55 : 0.07;
      if (Math.random() < chance) { this.running = true; this.msg = '🎉 ЗАВЁЛСЯ!'; Sfx.success(); Sfx.setEngine(true, 0.25); this.puff(); this.puff(); }
      else this.msg = this.pop ? 'Почти! Ещё раз!' : 'Не схватывает… На холодную без подсоса тяжело.';
    }
    this.ui();
  }
  puff() { for (let i = 0; i < 12; i++) this.smoke.push({ x: 600, y: 160, vx: rand(20, 80), vy: rand(-60, -20), life: rand(1, 2) }); }
  update(dt) {
    this.t += dt;
    if (!this.handle.drag && this.handle.y > 0) this.handle.y = Math.max(0, this.handle.y - dt * 900);
    if (this.drying) { this.dry += dt / 3; if (this.dry >= 1) { this.drying = false; this.flooded = false; this.choke = false; this.msg = 'Свеча сухая. Подсос выключен. Пробуй.'; this.ui(); } }
    if (this.running) { Sfx.setEngine(true, 0.2 + Math.sin(this.t * 3) * 0.03); if (Math.random() < dt * 8) this.puff(); }
    for (const s of this.smoke) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; }
    this.smoke = this.smoke.filter(s => s.life > 0);
  }
  draw(ctx) {
    ctx.fillStyle = '#455a64'; ctx.fillRect(0, 0, 800, 450);
    ctx.fillStyle = '#37474f'; ctx.fillRect(0, 360, 800, 90);
    const shake = this.running ? Math.sin(this.t * 70) * 2 : 0;
    ctx.save(); ctx.translate(shake, 0);
    drawSaw(ctx, 470, 200, 0.9);
    ctx.restore();
    // шнур и ручка
    const hy = 180 + this.handle.y;
    ctx.strokeStyle = '#eceff1'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(335, 170); ctx.lineTo(200, hy); ctx.stroke();
    ctx.fillStyle = '#212121'; roundRect(ctx, 165, hy - 12, 70, 24, 10); ctx.fill();
    if (!this.running && this.handle.y === 0) { ctx.fillStyle = `rgba(255,255,255,${0.5 + 0.5 * Math.sin(this.t * 5)})`; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('⬇ тяни', 200, 230); }
    for (const s of this.smoke) { ctx.fillStyle = `rgba(200,200,220,${s.life * 0.3})`; ctx.beginPath(); ctx.arc(s.x, s.y, 14 + (2 - s.life) * 10, 0, TAU); ctx.fill(); }
    if (this.drying) { ctx.fillStyle = '#000a'; ctx.fillRect(250, 400, 300, 20); ctx.fillStyle = '#ffb300'; ctx.fillRect(250, 400, 300 * this.dry, 20); }
  }
  exit() { Sfx.setEngine(false); }
}

// ---------- 8. Регулировка карбюратора (винты L и H)
class TuneGame {
  start(api) {
    this.api = api; this.t = 0; this.L = 50; this.H = 50; this.tL = randi(25, 75); this.tH = randi(25, 75);
    this.gas = false; this.rpm = 0.2; this.temp = 0.3; this.good = 0; this.done = false;
    this.ui();
    this.renderSliders();
  }
  renderSliders() {
    const box = document.createElement('div');
    box.className = 'mg-sliders';
    box.innerHTML = `<label>Винт L (холостой) <input type="range" min="0" max="100" value="${this.L}" id="tuneL"></label>
      <label>Винт H (максимал) <input type="range" min="0" max="100" value="${this.H}" id="tuneH"></label>`;
    $('#mg-info').appendChild(box);
    $('#tuneL').oninput = e => { this.L = +e.target.value; Sfx.ratchet(); };
    $('#tuneH').oninput = e => { this.H = +e.target.value; Sfx.ratchet(); };
  }
  ui() {
    this.api.info(`<div class="mg-sec"><b>🎛️ Регулировка карбюратора</b></div>
      <div class="mg-sec small">Крути <b>L</b>, пока холостые не станут ровными (стрелка «Стабильность» в зелёном).<br>Потом зажми <b>«ГАЗ»</b> и крути <b>H</b>: нужны максимальные обороты, но <b>без перегрева</b> (слишком бедная смесь греет мотор).</div>
      <div class="mg-sec small" id="tuneStatus">Держи обе стрелки в зелёном 2 секунды.</div>`);
    this.api.buttons([{ label: '🔥 ГАЗ (держать)', cls: 'primary', hold: on => { this.gas = on; } }]);
  }
  update(dt) {
    this.t += dt;
    const dL = Math.abs(this.L - this.tL), dH = this.H - this.tH;
    this.stab = clamp(100 - dL * 3.5 + Math.sin(this.t * 7) * (dL / 4), 0, 100);
    const target = this.gas ? clamp(1 - Math.abs(dH) / 45, 0.2, 1) : 0.18 + (100 - this.stab) / 400 * Math.sin(this.t * 9);
    this.rpm = lerp(this.rpm, target, dt * 4);
    const lean = this.gas && dH < -6;
    this.temp = clamp(this.temp + (lean ? dt * 0.25 * (-dH / 20) : -dt * 0.15), 0.2, 1);
    Sfx.setEngine(!this.done, this.rpm);
    const ok = this.stab >= 85 && this.gas && this.rpm >= 0.9 && this.temp < 0.7;
    this.good = ok ? this.good + dt : 0;
    if (this.good >= 2 && !this.done) {
      this.done = true; Sfx.setEngine(false);
      S.tank.fuel = Math.max(0, S.tank.fuel - 20);
      Motor.complete('Мотор поёт! Снегокат с мотором готов! 🏁');
    }
    if (this.temp >= 1 && !this.done) {
      this.temp = 0.5; this.H = Math.min(100, this.H + 10); const el = $('#tuneH'); if (el) el.value = this.H;
      Sfx.error(); UI.toast('🔥 Перегрев! Мотор заглох. Смесь слишком бедная — открой H.', 'bad');
    }
    const st = $('#tuneStatus');
    if (st && Math.floor(this.t * 4) !== Math.floor((this.t - dt) * 4)) st.innerHTML = ok ? `Держи… ${(2 - this.good).toFixed(1)} с` : (this.temp > 0.7 ? '🔥 Температура высокая!' : 'Держи обе стрелки в зелёном 2 секунды.');
  }
  gauge(ctx, x, y, label, v, zone, color) {
    ctx.fillStyle = '#212121'; ctx.beginPath(); ctx.arc(x, y, 80, Math.PI, 0); ctx.fill();
    ctx.lineWidth = 12;
    ctx.strokeStyle = '#424242'; ctx.beginPath(); ctx.arc(x, y, 64, Math.PI, 0); ctx.stroke();
    ctx.strokeStyle = color; ctx.beginPath(); ctx.arc(x, y, 64, Math.PI + zone[0] * Math.PI, Math.PI + zone[1] * Math.PI); ctx.stroke();
    const a = Math.PI + clamp(v, 0, 1) * Math.PI;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * 70, y + Math.sin(a) * 70); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(label, x, y + 22);
  }
  draw(ctx) {
    ctx.fillStyle = '#263238'; ctx.fillRect(0, 0, 800, 450);
    const shake = Math.sin(this.t * 80) * (1 + this.rpm * 3);
    ctx.save(); ctx.translate(shake, 0); drawSaw(ctx, 420, 140, 0.55); ctx.restore();
    this.gauge(ctx, 150, 380, 'Стабильность', this.stab / 100, [0.85, 1], '#00c853');
    this.gauge(ctx, 400, 380, 'Обороты ×1000', this.rpm, [0.9, 1], '#00c853');
    this.gauge(ctx, 650, 380, 'Температура', this.temp, [0.7, 1], '#d50000');
    ctx.fillStyle = '#fff'; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
    ctx.fillText(Math.round(this.rpm * 13000) + ' об/мин', 400, 300);
  }
  exit() { Sfx.setEngine(false); }
}

const MOTOR_GAMES = { bolts: BoltsGame, clean: CleanGame, parts: PartsGame, lathe: LatheGame, weld: WeldGame, chain: ChainGame, start: StartGame, tune: TuneGame };

const Motor = {
  stage() { return MOTOR_STAGES[S.motor.stage]; },
  missing(st) {
    const out = [];
    for (const k in st.req) if ((S.inv[k] || 0) < st.req[k]) out.push(ITEMS[k].name);
    if (st.fuel && S.tank.fuel < st.fuel) out.push(`смесь в баке ≥ ${st.fuel} мл`);
    return out;
  },
  begin() {
    const st = this.stage();
    if (!st) return;
    const miss = this.missing(st);
    if (miss.length) { UI.toast('Не хватает: ' + miss.join(', '), 'bad'); return; }
    if (st.id === 'buy') { this.completing = false; this.complete('Пила в гараже. Пахнет бензином и приключениями.'); return; }
    this.completing = false;
    MG.open(`Мотор: ${st.name}`, new MOTOR_GAMES[st.id]());
  },
  complete(msg) {
    if (this.completing) return;
    this.completing = true;
    const st = this.stage();
    for (const k in st.req) S.inv[k] = Math.max(0, (S.inv[k] || 0) - st.req[k]);
    S.motor.stage++;
    if (S.motor.stage >= MOTOR_STAGES.length) {
      S.motor.done = true; S.mods.motor = true; S.motor.health = 100;
      App.ach('motor');
    }
    Save.save();
    Sfx.success();
    setTimeout(() => {
      MG.close(false);
      UI.modal(`${st.icon} ${st.name} — готово!`, `<p>${msg}</p>${S.motor.done
        ? '<p><b>Теперь снегокат едет сам!</b> На горке держи <b>W / ↑</b> — газ. Следи за топливом и правильно мешай смесь 1:50.</p>'
        : `<p>Следующий этап: <b>${MOTOR_STAGES[S.motor.stage].name}</b></p>`}`);
    }, 300);
  },
};

</script>
<script>
'use strict';
// ===== Горка: физика, трюки, стройка лопатой, ночь =====
const G = 600;              // гравитация, единиц/с² (40 единиц ≈ 1 м)
const UNITS_PER_M = 40;

const Ride = {
  W: 6000, STEP: 10, N: 601, START_EDIT: 1150, END_EDIT: 5750,
  h: null, ice: null, active: false, mode: 'ride', terrainDirty: false,
  K: {}, keyEdge: {},
  cam: { x: 0, y: 0, z: 1 },
  tool: 'raise',
  brush: { on: false, sx: 0, sy: 0, wx: 0, wy: 0 },
  popups: [], parts: [], flakes: [],

  // ---------- инициализация
  init() {
    this.cv = $('#ride-canvas');
    this.ctx = this.cv.getContext('2d');
    this.dark = document.createElement('canvas');
    this.dctx = this.dark.getContext('2d');
    window.addEventListener('resize', () => this.resize());
    this.resize();
    for (let i = 0; i < 140; i++) this.flakes.push({ x: Math.random(), y: Math.random(), s: rand(1, 3), v: rand(20, 60) });
    this.stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random() * 0.6, s: rand(0.5, 1.8), p: rand(0, 6) }));

    const map = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'gas', KeyW: 'gas', ArrowDown: 'brake', KeyS: 'brake', Space: 'push', KeyQ: 'sigL', KeyE: 'sigR', KeyH: 'horn', KeyZ: 'KeyZ', KeyX: 'KeyX', KeyC: 'KeyC', KeyV: 'KeyV' };
    window.addEventListener('keydown', e => {
      if (!this.active || MG.game || UI.modalOpen()) return;
      const k = map[e.code];
      if (k) { if (!this.K[k]) this.keyEdge[k] = true; this.K[k] = true; e.preventDefault(); }
      if (e.code === 'KeyR') this.restart();
      if (e.code === 'KeyB') this.toggleBuild();
      if (e.code === 'KeyN') this.toggleNight();
      if (e.code === 'KeyL') this.toggleHead();
    });
    window.addEventListener('keyup', e => { const k = map[e.code]; if (k) this.K[k] = false; });
    window.addEventListener('blur', () => { this.K = {}; });

    // тач-кнопки
    $$('#touch [data-k]').forEach(b => {
      const k = b.dataset.k;
      const on = e => { e.preventDefault(); if (!this.K[k]) this.keyEdge[k] = true; this.K[k] = true; b.classList.add('on'); };
      const off = e => { e.preventDefault(); this.K[k] = false; b.classList.remove('on'); };
      b.addEventListener('pointerdown', on);
      b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
    });
    $('#r-garage').onclick = () => { Sfx.click(); App.go('garage'); };
    $('#r-build').onclick = () => { Sfx.click(); this.toggleBuild(); };
    $('#r-night').onclick = () => { Sfx.click(); this.toggleNight(); };
    $('#r-restart').onclick = () => { Sfx.click(); this.restart(); };
    $('#r-light').onclick = () => { Sfx.click(); this.toggleHead(); };

    // стройка
    $$('#build-bar [data-tool]').forEach(b => b.onclick = () => { Sfx.click(); this.tool = b.dataset.tool; this.updateBuildBar(); });
    $('#b-reset').onclick = () => UI.modal('Сбросить горку?', 'Все постройки исчезнут, снег вернётся в запас.', [
      { label: 'Сбросить', cls: 'danger', onClick: () => { this.genTerrain(); S.snow = 600; this.terrainDirty = true; this.persist(); this.updateBuildBar(); } },
      { label: 'Отмена' },
    ]);
    const pan = (dir, on) => { this.K[dir > 0 ? 'panR' : 'panL'] = on; };
    [['#b-left', -1], ['#b-right', 1]].forEach(([id, d]) => {
      const b = $(id);
      b.addEventListener('pointerdown', e => { e.preventDefault(); pan(d, true); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => pan(d, false)));
    });

    const wpos = e => {
      const r = this.cv.getBoundingClientRect();
      const sx = e.clientX - r.left, sy = e.clientY - r.top;
      return [sx, sy, (sx - this.vw * 0.35) / this.cam.z + this.cam.x, (this.vh * 0.62 - sy) / this.cam.z + this.cam.y];
    };
    this.cv.addEventListener('pointerdown', e => {
      if (this.mode !== 'build') return;
      e.preventDefault();
      this.cv.setPointerCapture(e.pointerId);
      const [sx, sy, wx, wy] = wpos(e);
      Object.assign(this.brush, { on: true, sx, sy, wx, wy });
      if (this.tool === 'kicker' || this.tool === 'bigkicker' || this.tool === 'landing') { this.stamp(this.tool, wx); this.brush.on = false; }
    });
    this.cv.addEventListener('pointermove', e => {
      const [sx, sy, wx, wy] = wpos(e);
      Object.assign(this.brush, { sx, sy, wx, wy, hover: true });
    });
    const up = () => { if (this.brush.on) { this.brush.on = false; this.persist(); } };
    this.cv.addEventListener('pointerup', up);
    this.cv.addEventListener('pointercancel', up);
    this.cv.addEventListener('wheel', e => { if (this.mode === 'build') { this.cam.x += (e.deltaY + e.deltaX) * 1.2; e.preventDefault(); } }, { passive: false });
  },

  resize() {
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.vw = window.innerWidth; this.vh = window.innerHeight;
    this.cv.width = this.vw * this.dpr; this.cv.height = this.vh * this.dpr;
    this.dark.width = this.cv.width; this.dark.height = this.cv.height;
    this.cam.z = clamp(Math.min(this.vh / 620, this.vw / 980), 0.42, 1.7);
  },

  // ---------- рельеф
  genTerrain() {
    const h = new Float32Array(this.N);
    for (let i = 0; i < this.N; i++) {
      const x = i * this.STEP;
      if (x <= 160) h[i] = 520;
      else if (x < 1100) h[i] = 260 * (1 + Math.cos(Math.PI * (x - 160) / 940));
      else h[i] = Math.sin(x * 0.004) * 4;
      if (x > 5800) h[i] = Math.min(400, (x - 5800) * 1.6);
    }
    this.h = h;
    this.ice = new Uint8Array(this.N);
    // стартовые постройки
    this.stamp('kicker', 1700, true);
    this.stamp('landing', 2120, true);
    this.stamp('kicker', 3000, true);
  },
  loadTerrain() {
    if (S.terrain && S.terrain.length === this.N) {
      this.h = Float32Array.from(S.terrain);
      this.ice = new Uint8Array(this.N);
      if (S.ice) for (let i = 0; i < this.N; i++) this.ice[i] = S.ice.charCodeAt(i) === 49 ? 1 : 0;
    } else this.genTerrain();
  },
  persist() {
    if (!this.h || !this.terrainDirty) return;
    S.terrain = Array.from(this.h, v => Math.round(v * 10) / 10);
    S.ice = Array.from(this.ice).join('');
    this.terrainDirty = false;
    Save.dirty();
  },
  H(x) {
    const f = clamp(x / this.STEP, 0, this.N - 1.0001);
    const i = Math.floor(f), t = f - i;
    return this.h[i] + (this.h[i + 1] - this.h[i]) * t;
  },
  slope(x, d = 6) { return Math.atan2(this.H(x + d) - this.H(x - d), 2 * d); },
  // наклон «под полозом» — по точке позади (по ходу движения), чтобы кромка трамплина подбрасывала
  pslope(x, dir) { const d = 5; return dir >= 0 ? Math.atan2(this.H(x) - this.H(x - d), d) : Math.atan2(this.H(x + d) - this.H(x), d); },
  isIce(x) { return this.ice[clamp(Math.round(x / this.STEP), 0, this.N - 1)] === 1; },

  // ---------- стройка
  stamp(kind, wx, free) {
    const shapes = {
      kicker: { H: 65, L: 140 },
      bigkicker: { H: 105, L: 220 },
      landing: { H: 85, L: 340 },
    };
    const s = shapes[kind];
    const add = new Map();
    for (let i = 0; i < this.N; i++) {
      const x = i * this.STEP;
      let v = 0;
      if (kind === 'landing') {
        if (x >= wx - 110 && x < wx) v = s.H * (0.5 - 0.5 * Math.cos(Math.PI * (x - (wx - 110)) / 110));
        else if (x >= wx && x <= wx + s.L) v = s.H * (0.5 + 0.5 * Math.cos(Math.PI * (x - wx) / s.L));
      } else {
        if (x >= wx - s.L && x <= wx) v = s.H * Math.pow((x - (wx - s.L)) / s.L, 2);
        else if (x > wx && x < wx + 30) v = s.H * (1 - (x - wx) / 30);
      }
      if (v > 0) {
        if (!free && (x < this.START_EDIT || x > this.END_EDIT)) continue;
        add.set(i, Math.min(v, 650 - this.h[i]));
      }
    }
    let cost = 0; add.forEach(v => cost += Math.max(0, v) * this.STEP / 100);
    if (!free) {
      if (cost > S.snow) { UI.toast(`Мало снега: нужно ${Math.ceil(cost)}, есть ${Math.floor(S.snow)}. Покопай где-нибудь или купи самосвал.`, 'bad'); Sfx.error(); return; }
      S.snow -= cost; S.snowMoved += cost;
      if (S.snowMoved >= 1000) App.ach('builder');
      Sfx.noise(0.4, 0.3, 700);
      this.terrainDirty = true;
    }
    add.forEach((v, i) => { this.h[i] += Math.max(0, v); });
    if (!free) { this.persist(); this.updateBuildBar(); }
  },
  applyBrush(dt) {
    const b = this.brush; if (!b.on) return;
    const big = !!S.tools.shovel2;
    const R = big ? 90 : 60, rate = big ? 280 : 170;
    const i0 = Math.max(0, Math.ceil((b.wx - R) / this.STEP)), i1 = Math.min(this.N - 1, Math.floor((b.wx + R) / this.STEP));
    let moved = 0;
    const old = this.h.slice(Math.max(0, i0 - 2), Math.min(this.N, i1 + 3));
    const base = Math.max(0, i0 - 2);
    for (let i = i0; i <= i1; i++) {
      const x = i * this.STEP;
      if (x < this.START_EDIT || x > this.END_EDIT) continue;
      const w = 0.5 + 0.5 * Math.cos(Math.PI * Math.abs(x - b.wx) / R);
      let dh = 0;
      if (this.tool === 'raise') {
        if (this.h[i] < b.wy) dh = Math.min(rate * dt * w, b.wy - this.h[i]);
        const cost = dh * this.STEP / 100;
        if (cost > S.snow) dh = S.snow * 100 / this.STEP;
        dh = Math.min(dh, 650 - this.h[i]);
      } else if (this.tool === 'dig') {
        if (this.h[i] > b.wy) dh = -Math.min(rate * dt * w, this.h[i] - b.wy);
        dh = Math.max(dh, -60 - this.h[i]);
      } else if (this.tool === 'smooth') {
        let avg = 0, n = 0;
        for (let k = -3; k <= 3; k++) { const j = i + k - base; if (j >= 0 && j < old.length) { avg += old[j]; n++; } }
        dh = (avg / n - this.h[i]) * Math.min(1, 8 * dt) * w;
        if (dh > 0 && dh * this.STEP / 100 > S.snow) dh = 0;
      } else if (this.tool === 'ice' || this.tool === 'unice') {
        if (Math.abs(x - b.wx) < R * 0.7) {
          const v = this.tool === 'ice' ? 1 : 0;
          if (this.ice[i] !== v) { this.ice[i] = v; this.terrainDirty = true; }
        }
        continue;
      }
      if (dh) {
        this.h[i] += dh;
        const c = dh * this.STEP / 100;
        S.snow = Math.max(0, S.snow - c);
        moved += Math.abs(c);
      }
    }
    if (moved > 0) {
      this.terrainDirty = true;
      S.snowMoved += moved;
      if (S.snowMoved >= 1000) App.ach('builder');
      if (Math.random() < dt * 6) Sfx.noise(0.15, 0.12, 900);
      if (Math.random() < dt * 20) this.parts.push({ x: b.wx + rand(-20, 20), y: this.H(b.wx) + 5, vx: rand(-80, 80), vy: rand(60, 200), life: 0.7, type: 'snow' });
      this.updateBuildBarSnow();
    }
  },
  updateBuildBar() {
    $$('#build-bar [data-tool]').forEach(b => {
      b.classList.toggle('active', b.dataset.tool === this.tool);
      if (b.dataset.tool === 'ice' || b.dataset.tool === 'unice') b.classList.toggle('hidden', !S.tools.bucket);
    });
    this.updateBuildBarSnow();
  },
  updateBuildBarSnow() { $('#b-snow').textContent = Math.floor(S.snow); },
  toggleBuild() {
    this.mode = this.mode === 'build' ? 'ride' : 'build';
    $('#build-bar').classList.toggle('hidden', this.mode !== 'build');
    $('#touch').classList.toggle('hidden', this.mode === 'build' || !this.touchUI);
    $('#r-build').innerHTML = this.mode === 'build' ? '🛷 Кататься' : '🪏 Стройка';
    this.persist();
    this.restart(true);
    if (this.mode === 'build') { this.cam.x = 1500; this.updateBuildBar(); if (!S.stats.builtHint) { S.stats.builtHint = 1; UI.toast('Зажми на экране, чтобы насыпать снег до этой высоты. Двигай камеру стрелками/колесом.'); } }
  },
  toggleNight() {
    S.settings.night = !S.settings.night;
    $('#r-night').innerHTML = S.settings.night ? '☀️ День' : '🌙 Ночь';
    if (S.settings.night && !S.mods.headlight) UI.toast('Ночью без фары ничего не видно! Спаяй фару в гараже.');
    Save.dirty();
  },
  toggleHead() {
    if (!S.mods.headlight) { UI.toast('Фары нет — спаяй в гараже 🔦'); return; }
    S.modOn.headlight = !S.modOn.headlight; Sfx.click(); Save.dirty();
  },

  // ---------- вход/выход
  enter() {
    this.active = true;
    this.loadTerrain();
    this.resize();
    this.touchUI = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
    this.mode = 'ride';
    $('#build-bar').classList.add('hidden');
    $('#touch').classList.toggle('hidden', !this.touchUI);
    $('#r-build').innerHTML = '🪏 Стройка';
    $('#r-night').innerHTML = S.settings.night ? '☀️ День' : '🌙 Ночь';
    $('#r-light').classList.toggle('hidden', !S.mods.headlight);
    $$('#touch [data-need]').forEach(b => b.classList.toggle('hidden', !S.mods[b.dataset.need]));
    this.restart(true);
    this.last = performance.now();
    cancelAnimationFrame(this.raf);
    const loop = now => {
      if (!this.active) return;
      const dt = Math.min(0.05, (now - this.last) / 1000);
      this.last = now;
      this.update(dt);
      this.render();
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
    if (S.stats.runs === 0) setTimeout(() => this.showHelp(), 300);
  },
  exit() {
    this.active = false;
    cancelAnimationFrame(this.raf);
    this.persist();
    Sfx.setEngine(false);
    Sfx.stopMusic();
    Save.save();
  },
  showHelp() {
    UI.modal('Как кататься 🛷', `
      <table class="keys">
      <tr><td><kbd>Пробел</kbd></td><td>оттолкнуться ногой</td></tr>
      <tr><td><kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd></td><td>вращение в воздухе (сальто)</td></tr>
      <tr><td><kbd>Z</kbd> <kbd>X</kbd> <kbd>C</kbd> <kbd>V</kbd></td><td>трюки: Супермен, Без рук, Канкан, Шпагат — <b>держи</b> в воздухе и отпусти до приземления!</td></tr>
      <tr><td><kbd>↓</kbd> / <kbd>S</kbd></td><td>тормоз</td></tr>
      <tr><td><kbd>↑</kbd> / <kbd>W</kbd></td><td>газ (когда соберёшь мотор)</td></tr>
      <tr><td><kbd>Q</kbd> <kbd>E</kbd> <kbd>H</kbd> <kbd>L</kbd></td><td>поворотники, клаксон, фара</td></tr>
      <tr><td><kbd>B</kbd> <kbd>N</kbd> <kbd>R</kbd></td><td>стройка, ночь, заново</td></tr>
      </table>
      <p>Приземляйся полозьями <b>вдоль склона</b>. Разные трюки в одном прыжке умножают очки. Очки → монеты → детали.</p>`, [{ label: 'Погнали!', cls: 'primary' }]);
  },

  restart(silent) {
    const x = 70;
    this.p = {
      x, y: this.H(x), vx: 0, vy: 0, s: 0, ang: 0, angV: 0, ground: true, air: 0, rot: 0, takeX: x, takeY: 0,
      trick: null, trickT: 0, tricks: {}, recover: 0, joints: Sled.makeJoints('sit'),
      crashed: false, crashT: 0, rider: null, pushCD: 0, pushT: 0, stopT: 0, wheelRot: 0,
      lastSig: -99, engine: false, maxX: x, seized: false, hornCD: 0, lowFuelWarn: false,
    };
    this.run = { started: false, score: 0, time: 0, jumps: 0, bestJump: 0, maxSpeed: 0, flips: 0, ended: false, wentFar: false, list: [] };
    this.cam.x = x + 200; this.cam.y = this.p.y;
    this.popups = []; this.parts = [];
    Sfx.setEngine(false);
    if (!silent) Sfx.click();
  },

  // ---------- игровой цикл
  update(dt) {
    this.t = (this.t || 0) + dt;
    if (this.mode === 'build') {
      const pan = (this.K.left || this.K.panL ? -1 : 0) + (this.K.right || this.K.panR ? 1 : 0);
      this.cam.x = clamp(this.cam.x + pan * 700 * dt, 0, this.W);
      this.cam.y = lerp(this.cam.y, this.H(this.cam.x) + 80, dt * 3);
      this.applyBrush(dt);
    } else if (!this.run.ended && !UI.modalOpen()) {
      const n = 4;
      for (let i = 0; i < n; i++) this.step(dt / n);
      this.control(dt);
      // камера
      const p = this.p;
      const tx = (p.crashed && p.rider ? p.rider.x : p.x) + clamp(p.vx || p.s, -400, 900) * 0.25;
      const ty = (p.crashed && p.rider ? p.rider.y : p.y) + 40;
      this.cam.x = lerp(this.cam.x, tx, 1 - Math.exp(-dt * 4));
      this.cam.y = lerp(this.cam.y, ty, 1 - Math.exp(-dt * 3));
    }
    // частицы
    for (const q of this.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy -= (q.type === 'smoke' ? -20 : 500) * dt; q.life -= dt; }
    this.parts = this.parts.filter(q => q.life > 0);
    for (const pp of this.popups) pp.t += dt;
    this.popups = this.popups.filter(pp => pp.t < 2.2);
    this.keyEdge = {};
  },

  motorReady() { return S.mods.motor && !S.motor.seized && S.motor.health > 0 && S.tank.fuel > 0.5; },

  control(dt) {
    const p = this.p, K = this.K, E = this.keyEdge;
    // клаксон
    if (S.mods.horn && E.horn) { Sfx.hornTone(); }
    // поворотники
    if (S.mods.turn && (K.sigL || K.sigR)) p.lastSig = this.t;
    // толчок
    p.pushCD -= dt; p.pushT -= dt;
    if (E.push && p.ground && !p.crashed && p.pushCD <= 0 && Math.abs(p.s) < 280) {
      p.s += 120; p.pushCD = 0.4; p.pushT = 0.35;
      this.run.started = true;
      Sfx.noise(0.12, 0.15, 800);
    }
    // мотор
    const gas = K.gas && this.motorReady() && !p.crashed;
    if (S.mods.motor && K.gas && !this.motorReady() && !p.fuelMsgT) {
      p.fuelMsgT = 1;
      this.popup(S.motor.health <= 0 ? 'Мотор заклинило!' : 'Бак пуст! ⛽', '#ff5252');
    }
    if (p.fuelMsgT) { p.fuelMsgT -= dt; if (p.fuelMsgT <= 0) p.fuelMsgT = 0; }
    if (gas) { p.engine = true; this.run.started = true; }
    if (p.engine && this.motorReady()) {
      const use = (gas ? 7 : 0.25) * dt;
      const tot = S.tank.fuel + S.tank.oil;
      const ratio = S.tank.oil > 0 ? S.tank.fuel / S.tank.oil : 999;
      S.tank.fuel = Math.max(0, S.tank.fuel - use * S.tank.fuel / tot);
      S.tank.oil = Math.max(0, S.tank.oil - use * S.tank.oil / tot);
      if (gas && ratio > 70) {
        S.motor.health -= dt * (ratio > 150 ? 8 : 1.5);
        if (Math.random() < dt * 0.5) this.popup('Мотор греется! Мало масла', '#ffab40');
        if (S.motor.health <= 0) { S.motor.health = 0; this.popup('💥 ЗАКЛИНИЛО! Нужна поршневая', '#ff1744'); Sfx.crash(); p.engine = false; }
      }
      if (gas && ratio < 30 && Math.random() < dt * 20) this.parts.push({ x: p.x - 70, y: p.y + 30, vx: rand(-40, 0), vy: rand(10, 40), life: 1.5, type: 'smoke', dark: true });
      if (S.tank.fuel < 40 && !p.lowFuelWarn) { p.lowFuelWarn = true; this.popup('Топливо на исходе!', '#ffab40'); }
      p.rpm = lerp(p.rpm || 0.15, gas ? (p.ground ? clamp(0.5 + Math.abs(p.s) / 1400, 0, 1) : 1) : 0.15, dt * 6);
      Sfx.setEngine(true, p.rpm);
      if (gas && Math.random() < dt * 25) this.parts.push({ x: p.x - 75 * Math.cos(p.ang), y: p.y + 26, vx: rand(-60, -20), vy: rand(10, 30), life: 0.8, type: 'smoke' });
    } else if (p.engine) { p.engine = false; Sfx.setEngine(false); }
    p.gas = gas;

    // музыка
    if (S.mods.speaker && S.modOn.speaker && this.run.started && !this.run.ended) Sfx.startMusic(); else Sfx.stopMusic();

    // трюки в воздухе
    if (!p.ground && !p.crashed) {
      let held = null;
      for (const k in TRICKS) if (K[k]) held = k;
      if (held !== p.trick) {
        if (p.trick && !held) p.recover = 0.16;
        p.trick = held;
        if (held) Sfx.trick();
      }
      if (p.trick) p.tricks[p.trick] = (p.tricks[p.trick] || 0) + dt;
      if (p.recover > 0) p.recover -= dt;
    }
    // поза
    let pose = 'sit';
    if (p.trick) pose = TRICKS[p.trick].pose;
    else if (p.pushT > 0) pose = 'push';
    else if (K.brake && p.ground) pose = 'back';
    else if (gas || (p.ground && p.s > 500)) pose = 'lean';
    Sled.blendJoints(p.joints, pose, 1 - Math.exp(-dt * (p.trick ? 14 : 10)));

    // скорость / рекорды
    const speedKmh = Math.abs(p.ground ? p.s : Math.hypot(p.vx, p.vy)) / UNITS_PER_M * 3.6;
    p.kmh = speedKmh;
    if (!p.crashed) this.run.maxSpeed = Math.max(this.run.maxSpeed, speedKmh);
    if (S.mods.speedo && speedKmh >= 50) App.ach('speed');
    if (p.x > 1300) this.run.wentFar = true;
    if (this.run.wentFar && S.mods.motor && p.x < 260 && p.ground) App.ach('climb');
    p.maxX = Math.max(p.maxX, p.x);
    if (p.x > 40) this.run.started = this.run.started || Math.abs(p.s) > 20;
    if (this.run.started) this.run.time += dt;

    // снежная пыль
    if (p.ground && !p.crashed && Math.abs(p.s) > 150 && Math.random() < dt * 30) {
      this.parts.push({ x: p.x - 40, y: p.y + 2, vx: -p.s * 0.2 + rand(-40, 40), vy: rand(40, 140), life: 0.6, type: 'snow' });
    }
    // конец заезда
    if (p.crashed) {
      p.crashT += dt;
      if (p.crashT > 2.2) this.endRun(true);
    } else if (this.run.started && p.ground && Math.abs(p.s) < 10 && !gas) {
      p.stopT += dt;
      if (p.stopT > (S.mods.motor ? 3 : 1.6)) this.endRun(false);
    } else p.stopT = 0;
  },

  step(dt) {
    const p = this.p;
    if (p.crashed) {
      const r = p.rider;
      r.vy -= G * dt; r.x += r.vx * dt; r.y += r.vy * dt; r.a += r.va * dt;
      const gh = this.H(r.x);
      if (r.y < gh + 6) { r.y = gh + 6; r.vy = Math.abs(r.vy) * 0.3; r.vx *= 0.7; r.va *= 0.6; if (Math.abs(r.vy) > 60) Sfx.land(0.2); }
      // снегокат скользит дальше сам
      if (p.ground) {
        const th = this.slope(p.x);
        p.s += (-G * Math.sin(th)) * dt; p.s *= (1 - 1.5 * dt);
        p.x = clamp(p.x + p.s * Math.cos(th) * dt, 5, this.W - 5); p.y = this.H(p.x); p.ang = lerp(p.ang, th, 0.2);
      } else {
        p.vy -= G * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.ang += p.angV * dt;
        if (p.y <= this.H(p.x)) { p.ground = true; p.y = this.H(p.x); p.s = p.vx * 0.4; }
      }
      return;
    }
    if (p.ground) {
      const dir = p.s >= 0 ? 1 : -1;
      const th = this.pslope(p.x, dir);
      const ice = this.isIce(p.x);
      const mu = ice ? 0.01 : (S.tools.wax ? 0.025 : 0.045);
      let a = -G * Math.sin(th);
      if (p.gas) {
        let thrust = 270 * (1 - clamp(p.s / 820, -0.2, 1));
        const ratio = S.tank.oil > 0 ? S.tank.fuel / S.tank.oil : 999;
        if (ratio < 30) thrust *= 0.75;
        a += thrust * (ice ? 0.35 : 1);
        p.wheelRot += dt * 40;
      }
      const fr = mu * G * Math.cos(th) + (this.K.brake ? 380 : 0) + 0.00008 * p.s * p.s;
      if (Math.abs(p.s) < 4 && Math.abs(a) <= fr) p.s = 0;
      else {
        p.s += a * dt;
        const sg = Math.sign(p.s);
        p.s -= sg * fr * dt;
        if (Math.sign(p.s) !== sg) p.s = 0;
      }
      const vx = p.s * Math.cos(th), vy = p.s * Math.sin(th);
      let nx = p.x + vx * dt;
      if (nx < 8) { nx = 8; p.s = Math.max(0, p.s); }
      if (nx > this.W - 8) { nx = this.W - 8; p.s = Math.min(0, p.s); }
      const by = p.y + vy * dt - 0.5 * G * dt * dt;
      const gh = this.H(nx);
      if (gh < by - 1.2 && Math.abs(p.s) > 60) {
        p.ground = false; p.x = nx; p.y = by; p.vx = vx; p.vy = vy - G * dt;
        p.ang = Math.atan2(vy, vx) + (dir < 0 ? Math.PI : 0); p.ang = wrapAngle(p.ang);
        p.air = 0; p.rot = 0; p.takeX = nx; p.takeY = by; p.tricks = {}; p.trick = null; p.recover = 0; p.angV = 0; p.peak = by;
        p.sigBonus = this.t - p.lastSig < 2.5;
      } else {
        p.x = nx; p.y = gh;
        const th2 = this.pslope(nx, dir);
        p.s = vx * Math.cos(th2) + vy * Math.sin(th2);
      }
      const sa = Math.atan2(this.H(p.x + 30) - this.H(p.x - 30), 60);
      p.ang = lerp(p.ang, sa, 0.35);
    } else {
      p.air += dt;
      p.vy -= G * dt;
      p.vx *= (1 - 0.02 * dt);
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.peak = Math.max(p.peak, p.y);
      if (p.x < 8) { p.x = 8; p.vx = Math.abs(p.vx) * 0.3; }
      if (p.x > this.W - 8) { p.x = this.W - 8; p.vx = -Math.abs(p.vx) * 0.3; }
      const input = (this.K.left ? 1 : 0) - (this.K.right ? 1 : 0);
      const rs = S.tools.grips ? 8.0 : 6.4;
      p.angV = lerp(p.angV, input * rs, 1 - Math.exp(-dt * (input ? 9 : 2.5)));
      p.ang += p.angV * dt; p.rot += p.angV * dt;
      // без вращения снегокат плавно ложится по траектории — так проще приземляться
      if (!input && Math.abs(p.angV) < 1.5) {
        const va = Math.atan2(p.vy, p.vx) + (p.vx < 0 ? Math.PI : 0);
        const dd = wrapAngle(va - p.ang);
        if (Math.abs(dd) < 1.2) p.ang += clamp(dd, -1, 1) * (1 - Math.exp(-dt * 1.6));
      }
      if (p.gas) p.wheelRot += dt * 60;
      if (p.y <= this.H(p.x)) this.land();
    }
  },

  land() {
    const p = this.p;
    const th = this.slope(p.x);
    const diff = wrapAngle(p.ang - th);
    const vn = -p.vx * Math.sin(th) + p.vy * Math.cos(th);
    const impact = -vn;
    p.y = this.H(p.x);
    p.ground = true;
    p.s = p.vx * Math.cos(th) + p.vy * Math.sin(th);
    if (p.air < 0.3 && Math.abs(diff) < 1.2) { p.ang = th; return; }
    const tol = 0.62 + (S.tools.seat ? 0.22 : 0);
    const maxImpact = S.tools.seat ? 1400 : 1050;
    let reason = null;
    if (Math.abs(diff) > tol) reason = Math.abs(diff) > 2.2 ? 'Приземлился на голову!' : 'Кривое приземление';
    else if (p.trick || p.recover > 0) reason = 'Не успел сесть обратно!';
    else if (impact > maxImpact) reason = 'Слишком жёстко!';
    if (reason) { this.crash(reason); return; }
    p.ang = th;
    Sfx.land(clamp(impact / 1000, 0, 1));
    for (let i = 0; i < 14; i++) this.parts.push({ x: p.x + rand(-40, 30), y: p.y + 2, vx: rand(-120, 120) + p.s * 0.2, vy: rand(60, 220), life: 0.8, type: 'snow' });
    this.scoreJump(Math.abs(diff));
  },

  scoreJump(diff) {
    const p = this.p;
    const items = [];
    let pts = 0, kinds = 0;
    const flips = Math.floor((Math.abs(p.rot) + 0.75) / TAU);
    if (flips > 0) {
      const pre = ['', '', 'Двойной ', 'Тройной ', 'Четверной ', 'Безумный '][Math.min(flips, 5)];
      const name = pre + (p.rot > 0 ? 'бэкфлип' : 'фронтфлип');
      const v = 500 * flips * (flips + 1) / 2;
      items.push([name, v]); pts += v; kinds++;
      this.run.flips += flips; S.stats.flips += flips;
      App.ach('first_flip');
      if (flips >= 2) App.ach('double');
      if (flips >= 3) App.ach('triple');
    }
    for (const k in p.tricks) {
      const t = p.tricks[k];
      if (t < 0.25) continue;
      const v = Math.round(100 + TRICKS[k].rate * t);
      items.push([`${TRICKS[k].name} ${t.toFixed(1)}с`, v]); pts += v; kinds++;
    }
    if (p.air > 0.7) { const v = Math.round(p.air * 120); items.push([`Полёт ${p.air.toFixed(1)} с`, v]); pts += v; }
    const d = Math.abs(p.x - p.takeX);
    if (d > 200) { const v = Math.round((d - 200) * 0.8); items.push([`Дальность ${(d / UNITS_PER_M).toFixed(1)} м`, v]); pts += v; }
    if (p.sigBonus && S.mods.turn) { items.push(['Показал поворотник 😇', 100]); pts += 100; App.ach('signal'); }
    if (diff < 0.12 && pts > 0) { const v = Math.round(pts * 0.15); items.push(['Чистое приземление', v]); pts += v; }
    const mult = Math.max(1, kinds);
    const total = Math.round(pts * mult);
    if (p.air >= 2) App.ach('big_air');
    if (d / UNITS_PER_M >= 20) App.ach('long_jump');
    if (kinds >= 3) App.ach('combo3');
    S.stats.bestAir = Math.max(S.stats.bestAir, p.air);
    S.stats.bestDist = Math.max(S.stats.bestDist, d / UNITS_PER_M);
    if (total > 0) {
      this.run.score += total; this.run.jumps++;
      this.run.bestJump = Math.max(this.run.bestJump, total);
      this.run.list.push(...items.map(i => i[0]));
      items.forEach((it, i) => setTimeout(() => this.popup(`${it[0]} +${it[1]}`, '#fff'), i * 140));
      setTimeout(() => this.popup(mult > 1 ? `КОМБО ×${mult} = ${total}` : `+${total}`, mult > 1 ? '#ffd740' : '#69f0ae', true), items.length * 140);
      Sfx.coin();
    }
  },

  crash(reason) {
    const p = this.p;
    p.crashed = true; p.crashT = 0; p.trick = null;
    p.rider = { x: p.x, y: p.y + 30, vx: p.vx * 0.8, vy: Math.abs(p.vy) * 0.3 + 150, a: p.ang, va: rand(-8, 8) };
    p.s = p.vx * 0.3; p.angV = rand(-4, 4);
    S.stats.crashes++;
    if (S.stats.crashes >= 10) App.ach('crash10');
    Sfx.crash();
    for (let i = 0; i < 30; i++) this.parts.push({ x: p.x + rand(-30, 30), y: p.y + 5, vx: rand(-200, 200), vy: rand(100, 300), life: 1, type: 'snow' });
    this.popup('💥 ' + reason, '#ff5252', true);
  },

  popup(text, color, big) { this.popups.push({ text, color, big, t: 0, off: this.popups.filter(p => p.t < 0.3).length }); },

  endRun(crashed) {
    if (this.run.ended) return;
    this.run.ended = true;
    Sfx.setEngine(false); Sfx.stopMusic();
    const r = this.run, p = this.p;
    const distM = Math.max(0, (p.maxX - 1100) / UNITS_PER_M);
    let coins = r.score / 12 + distM * 0.3;
    const mults = [];
    const night = S.settings.night && S.mods.headlight && S.modOn.headlight;
    if (night) { coins *= 1.5; mults.push('🌙 ночь ×1.5'); App.ach('night'); }
    if (S.mods.underglow && S.modOn.underglow) { coins *= 1.1; mults.push('🌈 подсветка ×1.1'); }
    if (S.mods.speaker && S.modOn.speaker) { coins *= 1.1; mults.push('🎵 музыка ×1.1'); }
    coins = Math.max(r.started ? 1 : 0, Math.round(coins));
    S.stats.runs++;
    S.stats.best = Math.max(S.stats.best, r.score);
    if (S.mods.speedo) S.stats.maxSpeed = Math.max(S.stats.maxSpeed, r.maxSpeed);
    App.ach('first_ride');
    App.addCoins(coins);
    Save.save();
    const best = r.score >= S.stats.best && r.score > 0;
    UI.modal(crashed ? 'Упал! 🤕' : 'Заезд окончен 🏁', `
      <div class="summary">
        <div class="big-num">${fmt(r.score)}<small> очков${best ? ' — рекорд! 🏆' : ''}</small></div>
        <div>Прыжков с трюками: <b>${r.jumps}</b> · Сальто: <b>${r.flips}</b></div>
        <div>Дальше всего: <b>${distM.toFixed(0)} м</b>${S.mods.speedo ? ` · Макс. скорость: <b>${r.maxSpeed.toFixed(0)} км/ч</b>` : ''}</div>
        ${mults.length ? `<div class="small">${mults.join(' · ')}</div>` : ''}
        <div class="coins-earned">+${coins} 🪙</div>
      </div>`, [
      { label: '↺ Ещё раз', cls: 'primary', onClick: () => this.restart() },
      { label: '🪏 Стройка', onClick: () => { this.restart(true); this.toggleBuild(); } },
      { label: '🏠 Гараж', onClick: () => App.go('garage') },
    ]);
  },

  // ---------- отрисовка
  w2s(x, y) { return [(x - this.cam.x) * this.cam.z + this.vw * 0.35, this.vh * 0.62 - (y - this.cam.y) * this.cam.z]; },

  render() {
    const ctx = this.ctx, W = this.vw, H = this.vh, z = this.cam.z, d = this.dpr;
    const night = S.settings.night;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    this.drawBackground(ctx, W, H, night);

    // мир (ось Y вверх)
    ctx.setTransform(d * z, 0, 0, -d * z, d * (W * 0.35 - this.cam.x * z), d * (H * 0.62 + this.cam.y * z));
    const x0 = this.cam.x - (W * 0.35) / z - 50, x1 = this.cam.x + (W * 0.65) / z + 50;
    const yBottom = this.cam.y - (H * 0.4) / z - 50;
    this.drawDecor(ctx, x0, x1, night);
    this.drawTerrain(ctx, x0, x1, yBottom);
    this.drawSledWorld(ctx);
    // частицы
    for (const q of this.parts) {
      if (q.type === 'snow') { ctx.fillStyle = `rgba(255,255,255,${q.life})`; ctx.fillRect(q.x, q.y, 4, 4); }
      else { ctx.fillStyle = q.dark ? `rgba(60,60,70,${q.life * 0.35})` : `rgba(220,220,230,${q.life * 0.35})`; ctx.beginPath(); ctx.arc(q.x, q.y, 6 + (1.5 - q.life) * 8, 0, TAU); ctx.fill(); }
    }
    if (this.mode === 'build') this.drawBuild(ctx, x0, x1);

    // ночь
    if (night) this.drawNight(ctx, W, H);

    // снегопад
    ctx.setTransform(d, 0, 0, d, 0, 0);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    for (const f of this.flakes) {
      f.y += f.v / H * 0.016; f.x += (Math.sin(this.t + f.s * 10) * 10 - (this.p.s || 0) * 0.02) / W * 0.016;
      if (f.y > 1) { f.y = 0; f.x = Math.random(); }
      f.x = (f.x + 1) % 1;
      ctx.fillRect(f.x * W, f.y * H, f.s, f.s);
    }
    this.drawHUD(ctx, W, H);
  },

  bgHill(x, a, b) { return Math.sin(x * a) * 0.5 + Math.sin(x * b + 1.3) * 0.3 + Math.sin(x * a * 2.7 + 4) * 0.2; },

  drawBackground(ctx, W, H, night) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    if (night) { g.addColorStop(0, '#030616'); g.addColorStop(1, '#1b2550'); }
    else { g.addColorStop(0, '#6fb1ff'); g.addColorStop(0.7, '#cfe6ff'); g.addColorStop(1, '#eef6ff'); }
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (night) {
      for (const s of this.stars) { ctx.fillStyle = `rgba(255,255,255,${0.5 + 0.5 * Math.sin(this.t * 2 + s.p)})`; ctx.fillRect(s.x * W, s.y * H, s.s, s.s); }
      ctx.fillStyle = '#fffde7'; ctx.beginPath(); ctx.arc(W * 0.8, H * 0.15, 28, 0, TAU); ctx.fill();
      ctx.fillStyle = '#030616'; ctx.beginPath(); ctx.arc(W * 0.8 + 12, H * 0.15 - 6, 24, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(255,250,220,0.9)'; ctx.beginPath(); ctx.arc(W * 0.82, H * 0.14, 34, 0, TAU); ctx.fill();
    }
    const horizon = H * 0.62 + this.cam.y * this.cam.z * 0.1;
    // дальние горы
    ctx.fillStyle = night ? '#18204a' : '#b3c7e6';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, horizon - 120 - this.bgHill((x + this.cam.x * 0.05) * 0.004, 1, 2.3) * 80);
    ctx.lineTo(W, H); ctx.fill();
    // ёлки и дома
    ctx.fillStyle = night ? '#121a38' : '#93aed6';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, horizon - 50 - this.bgHill((x + this.cam.x * 0.15) * 0.006, 1, 1.7) * 30);
    ctx.lineTo(W, H); ctx.fill();
    // панельки
    const off = this.cam.x * 0.25;
    for (let i = Math.floor(off / 260) - 1; i < Math.floor((off + W) / 260) + 1; i++) {
      const bx = i * 260 - off, bh = 90 + ((i * 37) % 5) * 18, bw = 110;
      if ((i * 7) % 3 === 0) continue;
      ctx.fillStyle = night ? '#0f1530' : '#a9bcd9';
      ctx.fillRect(bx, horizon - 40 - bh, bw, bh + 40);
      for (let wy = 0; wy < bh / 18 - 1; wy++) for (let wx = 0; wx < 6; wx++) {
        const lit = ((i * 13 + wx * 7 + wy * 3) % 5) < 2;
        ctx.fillStyle = night ? (lit ? '#ffd54f' : '#1a2348') : '#8ea6c9';
        ctx.fillRect(bx + 8 + wx * 17, horizon - 30 - bh + wy * 18, 9, 10);
      }
    }
    // ближние ёлки
    const off2 = this.cam.x * 0.4;
    ctx.fillStyle = night ? '#0b1a1a' : '#5d8a7a';
    for (let i = Math.floor(off2 / 90) - 1; i < Math.floor((off2 + W) / 90) + 1; i++) {
      if ((i * 11) % 4 === 0) continue;
      const tx = i * 90 - off2 + ((i * 29) % 40), th = 50 + ((i * 17) % 4) * 15, ty = horizon - 10;
      ctx.beginPath(); ctx.moveTo(tx, ty - th); ctx.lineTo(tx + th * 0.35, ty); ctx.lineTo(tx - th * 0.35, ty); ctx.fill();
    }
  },

  drawTree(ctx, x, s) {
    const y = this.H(x) - 2;
    ctx.fillStyle = '#4e342e'; ctx.fillRect(x - 4 * s, y, 8 * s, 18 * s);
    for (let i = 0; i < 3; i++) {
      const by = y + 14 * s + i * 22 * s, w = (34 - i * 8) * s;
      ctx.fillStyle = '#1b5e20';
      ctx.beginPath(); ctx.moveTo(x - w, by); ctx.lineTo(x + w, by); ctx.lineTo(x, by + 34 * s); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(x - w * 0.6, by + 10 * s); ctx.lineTo(x + w * 0.5, by + 12 * s); ctx.lineTo(x, by + 34 * s); ctx.fill();
    }
  },

  drawDecor(ctx, x0, x1, night) {
    // ёлки на стартовой горе
    [[20, 1.2], [300, 1], [520, 1.3], [780, 0.9], [980, 1.1]].forEach(([x, s]) => { if (x > x0 - 100 && x < x1 + 100) this.drawTree(ctx, x, s); });
    // флаг старт
    if (x0 < 200) {
      const y = this.H(150);
      ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(150, y); ctx.lineTo(150, y + 110); ctx.stroke();
      ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.moveTo(150, y + 110); ctx.lineTo(205, y + 98); ctx.lineTo(150, y + 84); ctx.fill();
    }
    // снеговик
    if (x0 < 1300 && x1 > 1150) {
      const x = 1240, y = this.H(x);
      ctx.fillStyle = '#fff';
      [[0, 18, 20], [0, 48, 14], [0, 70, 10]].forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(x + dx, y + dy, r, 0, TAU); ctx.fill(); });
      ctx.fillStyle = '#ff6d00'; ctx.beginPath(); ctx.moveTo(x + 8, y + 72); ctx.lineTo(x + 22, y + 69); ctx.lineTo(x + 8, y + 67); ctx.fill();
      ctx.fillStyle = '#111'; ctx.fillRect(x - 8, y + 80, 16, 10); ctx.fillRect(x - 11, y + 79, 22, 3);
    }
    // забор в конце
    if (x1 > 5700) {
      for (let x = 5760; x < 6000; x += 24) {
        const y = this.H(x);
        ctx.fillStyle = '#6d4c41'; ctx.fillRect(x, y - 5, 12, 70);
        ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, y + 64, 14, 6);
      }
    }
    // метки расстояния
    ctx.save();
    for (let m = 30; m * UNITS_PER_M < this.END_EDIT; m += 10) {
      const wx = m * UNITS_PER_M;
      if (wx < x0 || wx > x1) continue;
      const y = this.H(wx);
      ctx.strokeStyle = night ? '#90a4ae' : '#546e7a'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(wx, y); ctx.lineTo(wx, y + 40); ctx.stroke();
      ctx.fillStyle = m % 50 === 0 ? '#e53935' : '#ff7043'; ctx.fillRect(wx, y + 30, 18, 10);
    }
    ctx.restore();
  },

  drawTerrain(ctx, x0, x1, yBottom) {
    const night = S.settings.night;
    const step = this.STEP;
    const a = Math.max(0, Math.floor(x0 / step)), b = Math.min(this.N - 1, Math.ceil(x1 / step));
    const g = ctx.createLinearGradient(0, this.cam.y + 200, 0, yBottom);
    g.addColorStop(0, night ? '#c5d3f0' : '#ffffff'); g.addColorStop(1, night ? '#7d8fc0' : '#cddcf0');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(a * step, yBottom - 1000);
    for (let i = a; i <= b; i++) ctx.lineTo(i * step, this.h[i]);
    ctx.lineTo(b * step, yBottom - 1000);
    ctx.closePath(); ctx.fill();
    // кромка
    ctx.strokeStyle = night ? '#9fb3e0' : '#b3cde8'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = a; i <= b; i++) ctx.lineTo(i * step, this.h[i] - 4);
    ctx.stroke();
    // лёд
    ctx.strokeStyle = '#4fc3f7'; ctx.lineWidth = 5;
    ctx.beginPath();
    let open = false;
    for (let i = a; i <= b; i++) {
      if (this.ice[i]) { if (!open) { ctx.moveTo(i * step, this.h[i] + 1); open = true; } else ctx.lineTo(i * step, this.h[i] + 1); }
      else open = false;
    }
    ctx.stroke();
  },

  sledLights() {
    const p = this.p, K = this.K;
    return {
      head: S.mods.headlight && S.modOn.headlight,
      glow: S.mods.underglow && S.modOn.underglow,
      brake: S.mods.stoplight && !!K.brake,
      left: S.mods.turn && !!K.sigL,
      right: S.mods.turn && !!K.sigR,
    };
  },

  drawSledWorld(ctx) {
    const p = this.p;
    const opts = {
      t: this.t, joints: p.joints, mods: S.mods, paint: S.paint, glow: S.glow,
      lights: this.sledLights(), wheelRot: p.wheelRot, throttle: p.gas, engineOn: p.engine,
      noRider: p.crashed, music: Sfx.musicTimer, alarmBlink: false,
    };
    if (this.mode === 'ride' && p.ground && !p.crashed) p.wheelRot += (p.s / 12) * (1 / 60) * (p.gas ? 1.5 : 1) * (S.mods.motor ? 1 : 0);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.ang);
    Sled.draw(ctx, opts);
    ctx.restore();
    if (p.crashed && p.rider) {
      const r = p.rider;
      ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.a);
      Sled.drawRider(ctx, Sled.makeJoints('sprawl'), true);
      ctx.restore();
    }
  },

  drawBuild(ctx, x0, x1) {
    // запретные зоны
    ctx.fillStyle = 'rgba(255,0,0,0.08)';
    if (x0 < this.START_EDIT) ctx.fillRect(x0, -200, this.START_EDIT - x0, 1200);
    if (x1 > this.END_EDIT) ctx.fillRect(this.END_EDIT, -200, x1 - this.END_EDIT, 1200);
    // сетка высот
    ctx.strokeStyle = 'rgba(0,60,120,0.12)'; ctx.lineWidth = 1;
    for (let y = 0; y <= 650; y += 50) { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); }
    const b = this.brush;
    if (!b.hover && !b.on) return;
    const R = S.tools.shovel2 ? 90 : 60;
    if (['kicker', 'bigkicker', 'landing'].includes(this.tool)) {
      const s = { kicker: [65, 140], bigkicker: [105, 220], landing: [85, 340] }[this.tool];
      ctx.strokeStyle = 'rgba(255,111,0,0.9)'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
      ctx.beginPath();
      if (this.tool === 'landing') {
        for (let x = b.wx - 110; x < b.wx; x += 10) ctx.lineTo(x, this.H(x) + s[0] * (0.5 - 0.5 * Math.cos(Math.PI * (x - b.wx + 110) / 110)));
        for (let x = b.wx; x <= b.wx + s[1]; x += 10) ctx.lineTo(x, this.H(x) + s[0] * (0.5 + 0.5 * Math.cos(Math.PI * (x - b.wx) / s[1])));
      } else {
        for (let x = b.wx - s[1]; x <= b.wx; x += 10) ctx.lineTo(x, this.H(x) + s[0] * Math.pow((x - b.wx + s[1]) / s[1], 2));
        ctx.lineTo(b.wx + 30, this.H(b.wx + 30));
      }
      ctx.stroke(); ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = this.tool === 'dig' ? 'rgba(121,85,72,0.9)' : this.tool === 'ice' ? 'rgba(3,169,244,0.9)' : 'rgba(30,136,229,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(b.wx, b.wy, R, R * 0.4, 0, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(b.wx, this.H(b.wx)); ctx.lineTo(b.wx, b.wy); ctx.stroke();
      // лопата
      ctx.save(); ctx.translate(b.wx + 10, b.wy + 10); ctx.rotate(0.5);
      ctx.fillStyle = '#8d6e63'; ctx.fillRect(-2, 0, 4, 60);
      ctx.fillStyle = '#90a4ae'; roundRect(ctx, -10, -18, 20, 22, 4); ctx.fill();
      ctx.restore();
    }
  },

  drawNight(ctx, W, H) {
    const d = this.dpr, z = this.cam.z, p = this.p;
    const dc = this.dctx;
    dc.setTransform(1, 0, 0, 1, 0, 0);
    dc.globalCompositeOperation = 'source-over';
    dc.clearRect(0, 0, this.dark.width, this.dark.height);
    dc.fillStyle = 'rgba(2,4,16,0.9)';
    dc.fillRect(0, 0, this.dark.width, this.dark.height);
    dc.globalCompositeOperation = 'destination-out';
    dc.setTransform(d, 0, 0, d, 0, 0);
    // лунный свет вокруг
    const [px, py] = this.w2s(p.x, p.y + 40);
    let g = dc.createRadialGradient(px, py, 0, px, py, 140 * z);
    g.addColorStop(0, 'rgba(0,0,0,0.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    dc.fillStyle = g; dc.beginPath(); dc.arc(px, py, 140 * z, 0, TAU); dc.fill();
    const L = this.sledLights();
    if (L.head && !p.crashed) {
      const c = Math.cos(p.ang), s = Math.sin(p.ang);
      const lx = p.x + 25 * c - 44 * s, ly = p.y + 25 * s + 44 * c;
      const [sx, sy] = this.w2s(lx, ly);
      const ang = -p.ang + 0.12, len = 620 * z;
      g = dc.createRadialGradient(sx, sy, 0, sx, sy, len);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.6, 'rgba(0,0,0,0.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      dc.fillStyle = g;
      dc.beginPath(); dc.moveTo(sx, sy); dc.arc(sx, sy, len, ang - 0.36, ang + 0.36); dc.closePath(); dc.fill();
    }
    // окна домов и фонари — просто подсветим подсветку днища
    if (L.glow) {
      const [gx, gy] = this.w2s(p.x - 10 * Math.cos(p.ang), p.y);
      g = dc.createRadialGradient(gx, gy, 0, gx, gy, 110 * z);
      g.addColorStop(0, 'rgba(0,0,0,0.8)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      dc.fillStyle = g; dc.beginPath(); dc.arc(gx, gy, 110 * z, 0, TAU); dc.fill();
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(this.dark, 0, 0);
    // цветной отсвет
    if (L.glow) {
      ctx.setTransform(d, 0, 0, d, 0, 0);
      const [gx, gy] = this.w2s(p.x, p.y);
      ctx.globalCompositeOperation = 'lighter';
      const gg = ctx.createRadialGradient(gx, gy, 0, gx, gy, 120 * z);
      gg.addColorStop(0, hexA(S.glow, 0.35)); gg.addColorStop(1, hexA(S.glow, 0));
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(gx, gy, 120 * z, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
  },

  drawHUD(ctx, W, H) {
    const p = this.p;
    ctx.textBaseline = 'alphabetic';
    if (this.mode === 'build') {
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; roundRect(ctx, 10, 58, 250, 34, 10); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(`Высота: ${Math.max(0, Math.round(this.brush.wy / UNITS_PER_M * 10) / 10)} м  ·  X: ${Math.round(this.brush.wx / UNITS_PER_M)} м`, 20, 80);
      return;
    }
    // очки
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; roundRect(ctx, 10, 58, 190, 54, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
    ctx.font = 'bold 22px sans-serif'; ctx.fillText(fmt(this.run.score), 22, 86);
    ctx.font = '12px sans-serif'; ctx.fillStyle = '#cfd8dc'; ctx.fillText(`очков · рекорд ${fmt(S.stats.best)}`, 22, 103);
    // текущий прыжок
    if (!p.ground && !p.crashed && p.air > 0.3) {
      const parts = [];
      const fl = Math.abs(p.rot) / TAU;
      if (fl > 0.5) parts.push(`🔄 ${fl.toFixed(1)}`);
      for (const k in p.tricks) if (p.tricks[k] > 0.1) parts.push(`${TRICKS[k].name} ${p.tricks[k].toFixed(1)}`);
      ctx.textAlign = 'center'; ctx.font = 'bold 20px sans-serif';
      ctx.fillStyle = '#ffd740'; ctx.fillText(parts.join('  +  ') || `В воздухе ${p.air.toFixed(1)} с`, W / 2, 90);
    }
    // справа: спидометр, бак
    let ry = 58;
    ctx.textAlign = 'right';
    if (S.mods.speedo) {
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; roundRect(ctx, W - 140, ry, 130, 44, 8); ctx.fill();
      ctx.fillStyle = '#29b6f6'; ctx.font = 'bold 24px monospace'; ctx.fillText(`${Math.round(p.kmh || 0)}`, W - 62, ry + 32);
      ctx.font = '12px monospace'; ctx.fillText('км/ч', W - 20, ry + 32);
      ry += 52;
    }
    if (S.mods.motor) {
      const cap = S.tools.bigtank ? 1200 : 500;
      const f = (S.tank.fuel + S.tank.oil) / cap;
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; roundRect(ctx, W - 140, ry, 130, 40, 8); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(`⛽ ${Math.round(S.tank.fuel + S.tank.oil)} мл`, W - 132, ry + 15);
      ctx.fillStyle = '#424242'; ctx.fillRect(W - 132, ry + 22, 114, 8);
      ctx.fillStyle = f < 0.15 ? '#ff5252' : '#ffab00'; ctx.fillRect(W - 132, ry + 22, 114 * clamp(f, 0, 1), 8);
      ctx.textAlign = 'right'; ctx.fillStyle = S.motor.health < 40 ? '#ff5252' : '#b2ff59';
      ctx.fillText(`мотор ${Math.round(S.motor.health)}%`, W - 18, ry + 15);
      ry += 48;
    }
    // всплывашки
    ctx.textAlign = 'center';
    this.popups.forEach((pp, i) => {
      const a = clamp(2.2 - pp.t, 0, 1);
      const y = H * 0.32 - pp.t * 30 + (i % 6) * 26;
      ctx.font = `bold ${pp.big ? 28 : 18}px sans-serif`;
      ctx.lineWidth = 4; ctx.strokeStyle = `rgba(0,0,0,${a * 0.6})`; ctx.strokeText(pp.text, W / 2, y);
      ctx.fillStyle = pp.color; ctx.globalAlpha = a; ctx.fillText(pp.text, W / 2, y); ctx.globalAlpha = 1;
    });
    // подсказка на старте
    if (!this.run.started && this.mode === 'ride') {
      ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = `rgba(255,255,255,${0.6 + 0.4 * Math.sin(this.t * 4)})`;
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 4;
      const msg = this.touchUI ? 'Жми «Толчок», чтобы поехать!' : 'Жми ПРОБЕЛ, чтобы оттолкнуться!';
      ctx.strokeText(msg, W / 2, H * 0.22); ctx.fillText(msg, W / 2, H * 0.22);
    }
  },
};

</script>
<script>
'use strict';
// ===== Гараж: тюнинг, электроника, мотор, магазин, достижения =====
const Garage = {
  tab: 'sled', shopCat: 'radio', raf: 0,

  init() {
    $$('#g-tabs [data-tab]').forEach(b => b.onclick = () => { Sfx.click(); this.tab = b.dataset.tab; this.render(); });
    $('#btn-go').onclick = () => { Sfx.click(); App.go('ride'); };
    // делегирование кликов
    $('#g-body').addEventListener('click', e => {
      const el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      Sfx.click();
      this.act(el.dataset.act, el.dataset.id, el);
    });
  },

  enter(fromRide) {
    this.render();
    if (fromRide) this.theftCheck();
  },

  updateCoins() { const c = $('#g-coins'); if (c) c.textContent = fmt(S.coins); },

  theftCheck() {
    if (S.stats.runs < 3 || Math.random() > 0.12 || S.coins < 150) return;
    setTimeout(() => {
      if (S.mods.alarm) {
        Sfx.alarm(2);
        App.ach('thief');
        UI.modal('🚨 УИУИУИ!', 'Пока ты катался, какой-то тип полез к снегокату. <b>Сигналка заорала</b> — он сбежал, роняя шапку.<br>Сосед дал тебе <b>40 🪙</b> за бдительность.', [{ label: 'Ха!', onClick: () => App.addCoins(40) }]);
      } else {
        const lost = Math.min(250, Math.round(S.coins * 0.15));
        S.coins -= lost; Save.save(); this.updateCoins();
        UI.modal('😱 Обокрали!', `Пока ты катался, кто-то залез в гараж и стащил <b>${lost} 🪙</b> из банки на полке.<br><small>Спаяй сигнализацию — и такого не будет.</small>`, [{ label: 'Эх…' }]);
      }
    }, 400);
  },

  render() {
    this.updateCoins();
    $$('#g-tabs [data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === this.tab));
    const body = $('#g-body');
    cancelAnimationFrame(this.raf);
    const fn = { sled: 'renderSled', electro: 'renderElectro', motor: 'renderMotor', shop: 'renderShop', ach: 'renderAch', settings: 'renderSettings' }[this.tab];
    body.innerHTML = this[fn]();
    if (this.tab === 'sled') this.startPreview();
    if (this.tab === 'sled' && (S.mods.motor || S.motor.stage >= 7)) this.bindFuel();
  },

  invCount(id) {
    const it = ITEMS[id];
    if (it.tool) return S.tools[id] ? 'есть' : '';
    const n = S.inv[id] || 0;
    return n ? `${fmt(n)}${it.unit ? ' ' + it.unit : ' шт'}` : '';
  },

  // ---------- вкладка «Снегокат»
  renderSled() {
    const installed = PROJECTS.filter(p => S.mods[p.id]);
    const toggles = installed.filter(p => ['headlight', 'underglow', 'speaker'].includes(p.id)).map(p =>
      `<button class="chip ${S.modOn[p.id] ? 'on' : ''}" data-act="toggle" data-id="${p.id}">${p.icon} ${p.name}: ${S.modOn[p.id] ? 'вкл' : 'выкл'}</button>`).join('');
    const upgrades = Object.keys(ITEMS).filter(k => ITEMS[k].cat === 'upgrade' && ITEMS[k].tool && S.tools[k]).map(k => `<span class="tag">${ITEMS[k].icon} ${ITEMS[k].name}</span>`).join('');
    let fuel = '';
